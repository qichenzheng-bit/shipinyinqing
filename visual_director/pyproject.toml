[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipinyinqing-visual-director"
version = "0.1.0"
description = "Deterministic storyboard planner for the shipinyinqing mathematics teacher engine"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
visual-director = "visual_director.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]