name: WeiGuang frontend browser acceptance screenshots
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install application and headless Chromium
        run: |
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]' playwright
          python -m playwright install chromium --with-deps
      - name: Click every frontend screen against real FastAPI
        run: python backend/tests/capture_pages.py
      - name: Install CJK font and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
      - name: Encode and extract branded video frame
        run: python backend/tests/acceptance_one_frame.py
      - uses: actions/upload-artifact@v4
        with:
          name: weiguang-browser-and-ffmpeg-watermark-frames
          path: frontend/screenshots/*.png
          if-no-files-found: error
