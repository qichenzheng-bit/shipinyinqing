name: WeiGuang frontend browser acceptance screenshots
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  screenshots:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install actual application and browser
        run: |
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]' playwright
          python -m playwright install chromium --with-deps
      - name: Test navigation, CRUD and render every frontend screen
        run: |
          if [ ! -f frontend/screenshots/10-curriculum.png ]; then
            python backend/tests/capture_pages.py
          else
            echo "Screen captures already committed on this branch"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: weiguang-seven-front-end-screens
          path: frontend/screenshots/*.png
          if-no-files-found: error
      - name: Preserve acceptance screenshots on the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "test(ui): actual frontend screenshots [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
