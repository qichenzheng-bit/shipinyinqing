name: WeiGuang Windows workspace UI acceptance
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: windows-latest
    env:
      # Runner-only preinstalled PostgreSQL 17. Never a real user DB.
      WEIGUANG_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/postgres
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install application and headless Chromium
        run: |
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]' playwright
          python -m playwright install chromium
      - name: Start isolated PostgreSQL 17 on Windows CI
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $env:PGPASSWORD = 'root'
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT 1'
          if ($LASTEXITCODE -ne 0) { throw 'POSTGRESQL_17_NOT_AVAILABLE_IN_WINDOWS_CI' }
      - name: Click every frontend screen against real FastAPI
        run: python backend/tests/capture_pages.py
      - name: Capture actual Windows launcher local and HTTPS screens
        run: python desktop/tests/capture_launcher.py
      - name: Ensure native Windows FFmpeg and system CJK fonts
        shell: pwsh
        run: |
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ffmpeg -hide_banner -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "$env:WINDIR\\Fonts\\msyh.ttc") -and
              !(Test-Path "$env:WINDIR\\Fonts\\simhei.ttf") -and
              !(Test-Path "$env:WINDIR\\Fonts\\simsun.ttc")) {
            throw 'WINDOWS_CJK_FONT_NOT_INSTALLED'
          }
      - name: Encode and extract branded video frame
        run: python backend/tests/acceptance_one_frame.py
      # Screenshots and watermarked frame are temporary CI evidence only.
      # No media/screenshots are published among the two release files.
