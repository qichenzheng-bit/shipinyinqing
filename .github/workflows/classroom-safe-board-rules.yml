name: Real classroom safe board and category colors acceptance
on:
  push:
    branches: [feature/classroom-safe-board-rules-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]'
      - name: Original lesson teacher-source, fixed band and safe cue tests
        run: cd animation_engine && python -m pytest tests/test_classroom_rework.py -q
      - name: Backward-compatible animation contracts
        run: cd animation_engine && python -m pytest -q -m 'not render'
  real-classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install Manim, actual CJK font, LaTeX and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]' sympy
      - name: Independent symbolic check of the new integral and algebraic identity
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          integral=s.integrate(x**2*s.log(1+x),(x,0,1))
          expected=s.Rational(2,3)*s.log(2)-s.Rational(5,18)
          assert s.simplify(integral-expected)==0
          assert s.simplify(x**3/(1+x) - (x**2-x+1-1/(1+x)))==0
          remainder=s.integrate(x**3/(1+x),(x,0,1))
          assert s.simplify(remainder-(s.Rational(5,6)-s.log(2)))==0
          print('NEW_ORIGINAL_PROBLEM_SYMBOLICALLY_VERIFIED',expected)
          PY
      - name: Construct different teacher-authored lesson and audited teaching cues
        run: |
          mkdir -p classroom-redesign-evidence
          python animation_engine/tools/build_classroom_rework_example.py --output classroom-redesign-evidence
      - name: Actual MathTex glyph-driven page/collision preflight
        run: |
          math-animation plan-longboard --storyboard classroom-redesign-evidence/storyboard.json --execution classroom-redesign-evidence/execution.json --policy classroom-redesign-evidence/page_policy.json --output classroom-redesign-evidence/longboard.json
          python - <<'PY'
          import json
          from pathlib import Path
          from animation_engine.classroom_cues import checked_cues
          root=Path('classroom-redesign-evidence')
          layout=json.loads((root/'longboard.json').read_text())
          board=json.loads((root/'storyboard.json').read_text())
          plan=json.loads((root/'execution.json').read_text())
          cues=json.loads((root/'teacher_approved_cues.json').read_text())
          checked_cues(cues,board,plan)
          assert len(layout['events'])==14
          assert layout['events'][-1]['new_ids']==['m_final']
          assert all(p['y']>=130 and p['scale']>=.54
              for e in layout['events'] for p in e['placements'])
          cuts=[e['event_id'] for e in layout['events'] if e['transition']=='cut']
          assert layout['policy']['board_mode']=='simple_full_board'
          assert layout['policy']['content_top_offset_px']==0
          assert layout['policy']['guidance_style']=='board_context'
          assert layout['policy']['math_base_scale']==0.5625
          assert layout['policy']['cut_before_events']==[]
          assert len(cuts)<=5,cuts
          print('NEW_REAL_MATH_BOARD_LAYOUT',cuts)
          PY
      - name: Render newly directed full classroom video (not speech synchronized)
        run: |
          math-animation render-longboard --storyboard classroom-redesign-evidence/storyboard.json --execution classroom-redesign-evidence/execution.json --policy classroom-redesign-evidence/page_policy.json --classroom-cues classroom-redesign-evidence/teacher_approved_cues.json --output classroom-redesign-evidence/new_classroom_rework.mp4 --manifest classroom-redesign-evidence/video_manifest.json --fps 30
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json classroom-redesign-evidence/new_classroom_rework.mp4 > classroom-redesign-evidence/ffprobe.json
      - name: Inspect real video metadata and extract useful exact-stage frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          from PIL import Image,ImageDraw,ImageFont
          root=Path('classroom-redesign-evidence')
          manifest=json.loads((root/'video_manifest.json').read_text())
          info=json.loads((root/'ffprobe.json').read_text())['streams'][0]
          assert (info['width'],info['height'],info['r_frame_rate'])==(1280,720,'30/1')
          assert int(info['nb_read_frames'])>=1000
          assert len(manifest['event_timing'])==14
          assert manifest['classroom_direction']['cue_count']==14
          assert manifest['classroom_direction']['board_mode']=='simple_full_board'
          assert manifest['classroom_direction']['guidance_style']=='board_context'
          assert len(manifest['classroom_direction']['visible_board_interludes'])>=4
          assert manifest['classroom_direction']['reserved_band_px']==[]
          assert manifest['classroom_direction']['derivation_ink']=='#111111'
          assert manifest['classroom_direction']['category_styles']['strategy']['heading']=='#2563EB'
          assert manifest['classroom_direction']['category_styles']['knowledge']['heading']=='#7C3AED'
          assert manifest['classroom_direction']['category_styles']['pitfall']['heading']=='#DC2626'
          assert manifest['classroom_direction']['category_styles']['summary']['heading']=='#0F766E'
          assert manifest['classroom_direction']['detail_font_px']==16
          assert manifest['header']['ink_color']=='#111111'
          assert any(e['teaching_cue']['phase']=='pitfall' for e in manifest['event_timing'])
          assert all(e['contextual_capture_second'] is not None
              for e in manifest['event_timing'] if e['teaching_cue']['phase']
              in ('strategy','knowledge','pitfall','summary'))
          assert manifest['audio_status']=='no_audio'
          assert manifest['subtitle_status']=='not_rendered_no_audio'
          selected=['e_choice','e_transform','e_division','e_final']
          captures=[]
          for name in selected:
              e=next(x for x in manifest['event_timing'] if x['event_id']==name)
              assert e['teaching_cue'] is not None
              t=max(0,e['end_preview_second']-.28)
              path=root/(name+'.png')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-ss',str(t),'-i',str(root/'new_classroom_rework.mp4'),
                  '-frames:v','1',str(path)],check=True)
              im=Image.open(path).convert('RGB')
              assert im.size==(1280,720)
              captures.append((name,im.resize((640,360))))
          out=Image.new('RGB',(1280,780),'#E8EDF5')
          d=ImageDraw.Draw(out)
          for i,(name,im) in enumerate(captures):
              x,y=(i%2)*640,(i//2)*390+24
              out.paste(im,(x,y))
              d.text((x+12,y-18),name,fill='#1E293B')
          out.save(root/'real_four_stage_comparison.png')
          # Capture exact frames while the real teacher guide and its
          # MathTex are on the same stage. Inspect actual category ink pixels.
          import math
          from PIL import Image
          actual_colors={'strategy':(37,99,235),'knowledge':(124,58,237),
                         'pitfall':(220,38,38),'summary':(15,118,110)}
          for phase,expected in actual_colors.items():
              row=next(x for x in manifest['event_timing']
                       if x['teaching_cue']['phase']==phase
                       and x['contextual_capture_second'] is not None)
              seconds=row['contextual_capture_second']
              path=root/('actual_'+phase+'.png')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-ss',str(seconds),'-i',str(root/'new_classroom_rework.mp4'),
                  '-frames:v','1',str(path)],check=True)
              im=Image.open(path).convert('RGB')
              colors=[im.getpixel((x,y)) for y in range(146,185)
                      for x in range(320,1010,2)]
              # H.264 is lossy: allow small quantization/antialias drift.
              assert any(sum(abs(rgb[i]-expected[i]) for i in range(3))<78
                         for rgb in colors),(phase,'missing category ink')
              assert all(im.getpixel((x,y)) for x,y in [(400,200),(400,300)])
          assert all(e['contextual_capture_second'] is None
                     for e in manifest['event_timing']
                     if e['teaching_cue']['phase'] in ('calculate','application'))

          print('REAL_DIRECTED_VIDEO',info['nb_read_frames'],
                'DURATION',manifest['actual_preview_duration'],
                'CUTS',[e['event_id'] for e in manifest['events'] if e['transition']=='cut'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-board-category-colors-and-black-derivation
          path: classroom-redesign-evidence/
          if-no-files-found: warn
