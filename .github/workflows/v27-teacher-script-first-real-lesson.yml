name: V2.7 natural teacher narration and script-only acceptance
on:
  push:
    branches: [feature/v27-teacher-script-first-contract]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v27-nonrender-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install non-render dependencies only
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Run existing and new non-render regression suites
        run: |
          cd animation_engine && python -m pytest -q -m 'not render'
          cd ../teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
      - name: Prepare source-reviewed lesson (no TTS or render)
        run: python animation_engine/tools/build_novel_substitution_integral.py --output v27-integral
      - name: Export source-authoritative full spoken script only
        run: |
          math-animation export-spoken-script --spoken v27-integral/spoken_classroom.json --output v27-integral/lesson_script.md
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("v27-integral")
          data=json.loads((root/"lesson_script.json").read_text(encoding="utf-8"))
          assert data["acceptance"]["contract_version"]=="2.7"
          assert data["events"][-1]["phase"]=="summary"
          assert (root/"lesson_script.md").stat().st_size>1200
          print("V27_SCRIPT_ONLY_ACCEPTED",len(data["events"]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-narration-script-only-no-video
          path: |
            v27-integral/lesson_script.md
            v27-integral/lesson_script.json
            v27-integral/spoken_classroom.json
          if-no-files-found: warn
