name: WeiGuang Math Android APK
on:
  pull_request:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android_app/**'
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Android native APK build and emulator acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes the Android cmdline tools.
      # setup-android@v3 attempts to install the removed legacy "tools"
      # package on recent SDK repositories, so invoke sdkmanager directly.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Run Java origin security tests, lint and compile installable APK
        run: |
          gradle -p android_app --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check APK package, requested permissions and generated metadata
        run: |
          APK=android_app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > android_app/app/build/outputs/apk/debug/badging.txt
          grep -F "package: name='cn.weiguang.math'" android_app/app/build/outputs/apk/debug/badging.txt
          grep -F "sdkVersion:'29'" android_app/app/build/outputs/apk/debug/badging.txt
          grep -F "targetSdkVersion:'35'" android_app/app/build/outputs/apk/debug/badging.txt
          grep -F "versionCode='2'" android_app/app/build/outputs/apk/debug/badging.txt
          grep -F "versionName='1.0.1'" android_app/app/build/outputs/apk/debug/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" > android_app/app/build/outputs/apk/debug/permissions.txt
          grep -F "android.permission.INTERNET" android_app/app/build/outputs/apk/debug/permissions.txt
          if grep -q -E 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|CAMERA|RECORD_AUDIO|ACCESS_FINE_LOCATION)' android_app/app/build/outputs/apk/debug/permissions.txt; then
            echo "ANDROID_EXTRA_PERMISSIONS_FORBIDDEN"; exit 1
          fi
          unzip -l "$APK" | grep 'classes.dex'
          sha256sum "$APK" > android_app/app/build/outputs/apk/debug/SHA256SUMS.txt
          echo "ANDROID_INSTALLABLE_DEBUG_APK_ACCEPTED"
      - name: Enable KVM for actual Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch APK in Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            mkdir -p android_app/screenshots
            adb install -r android_app/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n cn.weiguang.math/.MainActivity
            sleep 5
            adb logcat -d -s AndroidRuntime:E | tee android_app/screenshots/launch-runtime.log
            adb shell pidof cn.weiguang.math || (echo "ANDROID_APP_EXITED_AFTER_LAUNCH"; cat android_app/screenshots/launch-runtime.log; exit 1)
            adb shell screencap -p /sdcard/weiguang-android-launch.png
            adb pull /sdcard/weiguang-android-launch.png android_app/screenshots/00-android-native-launcher.png
            test -s android_app/screenshots/00-android-native-launcher.png
            echo "ANDROID_EMULATOR_NATIVE_LAUNCH_ACCEPTED"
      - name: Assemble final Android 1.0.1 acceptance-app handoff
        if: success()
        shell: bash
        run: |
          mkdir -p android_app/release
          cp android_app/app/build/outputs/apk/debug/app-debug.apk \
            android_app/release/WeiGuang-Math-Android-1.0.1-Acceptance.apk
          (cd android_app/release && sha256sum *.apk > SHA256SUMS.txt)
          python - <<'PY'
          import json,os
          from pathlib import Path
          release=Path("android_app/release")
          item={
            "product":"微光数学","platform":"Android","version":"1.0.1",
            "application_id":"cn.weiguang.math","minimum_android":10,
            "source_sha":os.environ["GITHUB_SHA"],
            "artifact":"WeiGuang-Math-Android-1.0.1-Acceptance.apk",
            "signing":"Android SDK test/debug signing; NOT a production release",
            "production_account_signing_configured":False,
            "backend_required":"Existing HTTPS WeiGuang Math server",
            "source_embedded_secrets":False,
          }
          (release/"app-manifest.json").write_text(
            json.dumps(item,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("ANDROID_APP_HANDOFF_OK",item["artifact"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WeiGuang-Math-Android-1.0.1-App
          path: |
            android_app/release/*
            android_app/screenshots/*.png
            android_app/screenshots/*.log
          if-no-files-found: error
          retention-days: 30

  mobile-browser-ui:
    name: Android-sized browser UI and download tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install existing backend and browser
        run: |
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]' playwright
          python -m playwright install chromium --with-deps
      - name: Exercise genuine mobile API, pages and JSON export
        run: python backend/tests/capture_android_mobile.py
      - uses: actions/upload-artifact@v4
        with:
          name: WeiGuang-Math-Android-mobile-workspace-screenshots
          path: android_app/screenshots/*.png
          if-no-files-found: error
