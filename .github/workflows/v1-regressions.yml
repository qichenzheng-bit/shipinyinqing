name: V1 teacher and director regression tests

on:
  push:
    branches:
      - fix/v1-review-20261029
  pull_request:
    paths:
      - teacher_module/**
      - visual_director/**
      - .github/workflows/v1-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e './teacher_module[test]'
      - run: cd teacher_module && python -m pytest -q
  director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e './visual_director[test]'
      - run: cd visual_director && python -m pytest -q
