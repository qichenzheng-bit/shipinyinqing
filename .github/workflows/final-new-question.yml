name: Final new-question acceptance (no AI-model calls)

on:
  pull_request:
    branches: [main]
    paths:
      - 'animation_engine/tests/fixtures/build_final_fresh_trig_limit.py'
      - 'animation_engine/tests/test_final_fresh_trig_limit.py'
      - '.github/workflows/final-new-question.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  new-question-offline:
    name: Fresh trig-limit teaching package + authentic silent Manim render
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install source-verification packages only (NO LLM or TTS)
        run: |
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]'
      - name: Independently verify new question and V2.7 provenance
        run: python -m pytest -q animation_engine/tests/test_final_fresh_trig_limit.py
      - name: Export complete no-model classroom package and reviewed-source script
        run: |
          python animation_engine/tests/fixtures/build_final_fresh_trig_limit.py --output final-output/trig
          math-animation export-spoken-script --spoken final-output/trig/spoken_classroom.json --output final-output/trig/lesson_script.md
          math-animation plan-flow --flow final-output/trig/unified_flow.json --output final-output/trig/flow_plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("final-output/trig")
          source=json.loads((root/"lesson_script.json").read_text(encoding="utf-8"))
          assert source["acceptance"]["contract_version"] == "2.7"
          assert len(source["events"]) == 12
          assert not (root/"lesson_script_approval.json").exists()
          assert not list(root.rglob("*.mp4"))
          print("OFFLINE_NEW_QUESTION_PACKAGE_VERIFIED_NO_AI_MODEL")
          PY
      - name: Upload the source-complete classroom package even if media rendering fails
        uses: actions/upload-artifact@v4
        with:
          name: Final-New-Trig-Limit-V27-Source-Package
          path: final-output/trig/
          if-no-files-found: error
          retention-days: 30
      - name: Install real Manim, LaTeX, fonts and FFmpeg for silent visual acceptance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg dvisvgm \
            libpango1.0-dev libcairo2-dev pkg-config \
            fonts-noto-cjk texlive-latex-extra texlive-fonts-recommended texlive-science
          python -m pip install -e './animation_engine[render]' 
      - name: Render REAL 60 FPS Manim board without speech or model calls
        run: |
          mkdir -p final-output/render
          math-animation render-flow \
            --flow final-output/trig/unified_flow.json \
            --output final-output/render/raw-silent-manim.mp4 \
            --manifest final-output/render/render-manifest.json \
            --fps 60
      - name: Apply existing brand to silent visual QA movie and verify frames
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from animation_engine.brand_watermark import (
              make_brand_watermark, WATERMARK_RIGHT_MARGIN, WATERMARK_TOP_MARGIN,
          )
          root=Path("final-output/render")
          raw=root/"raw-silent-manim.mp4"
          target=root/"new-trig-limit-silent-QA-60fps.mp4"
          watermark=root/"watermark.png"
          make_brand_watermark(watermark)
          subprocess.run([
              "ffmpeg","-hide_banner","-loglevel","error","-y",
              "-i",str(raw),"-i",str(watermark),
              "-filter_complex",
              f"[0:v][1:v]overlay=W-w-{WATERMARK_RIGHT_MARGIN}:{WATERMARK_TOP_MARGIN}:shortest=1[v]",
              "-map","[v]","-an","-c:v","libx264","-preset","veryfast",
              "-crf","20","-pix_fmt","yuv420p","-r","60",
              "-movflags","+faststart",str(target),
          ],check=True)
          probe=subprocess.run([
              "ffprobe","-v","error","-count_frames",
              "-show_entries","stream=codec_type,width,height,r_frame_rate,nb_read_frames",
              "-of","json",str(target),
          ],capture_output=True,text=True,check=True)
          streams=json.loads(probe.stdout)["streams"]
          video=next(s for s in streams if s["codec_type"]=="video")
          assert (video["width"],video["height"])==(1280,720)
          assert video["r_frame_rate"]=="60/1"
          assert int(video["nb_read_frames"])>20
          manifest=json.loads((root/"render-manifest.json").read_text(encoding="utf-8"))
          assert manifest["fps"]==60 and manifest["fabricated_voice_or_subtitle_count"]==0
          assert abs(int(video["nb_read_frames"])-manifest["actual_video_frames"])<=2
          assert not any(s["codec_type"]=="audio" for s in streams)
          print("REAL_SILENT_MANIM_ACCEPTED",video["nb_read_frames"],"frames")
          PY
          ffmpeg -hide_banner -loglevel error -y \
            -sseof -0.05 -i final-output/render/new-trig-limit-silent-QA-60fps.mp4 \
            -frames:v 1 final-output/render/final-board.png
          test -s final-output/render/final-board.png
      - name: Upload authentic no-model 60fps silent video and still
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Final-New-Trig-Limit-Silent-Video-QA
          path: |
            final-output/render/new-trig-limit-silent-QA-60fps.mp4
            final-output/render/render-manifest.json
            final-output/render/final-board.png
          if-no-files-found: ignore
          retention-days: 30
