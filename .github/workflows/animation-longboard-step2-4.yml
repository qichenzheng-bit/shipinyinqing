name: Animation step 2.4 independent new integral acceptance
on:
  push:
    branches: [feature/animation-engine-v1-step2-4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install animation and director without optional renderer
        run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]'
      - name: New original teaching package through genuine storyboard and execution contracts
        run: |
          mkdir -p /tmp/longboard24
          python animation_engine/tools/build_fresh_integral_acceptance.py --output /tmp/longboard24
          python - <<'PY'
          import json
          from pathlib import Path
          from animation_engine.adaptive_layout import GlyphSize
          from animation_engine.longboard_plan import build_longboard_plan, LongboardPolicy
          p=Path('/tmp/longboard24')
          board=json.loads((p/'storyboard.json').read_text())
          execution=json.loads((p/'execution.json').read_text())
          policy=json.loads(Path('animation_engine/examples/new_integral_acceptance_policy.json').read_text())
          result=build_longboard_plan(board,execution,policy=policy,
              measure=lambda latex,h:GlyphSize(145,42))
          assert len(result['events'])==20
          assert [e['event_id'] for e in result['events']]==[s['event_id'] for s in board['scenes']]
          assert result['source_storyboard_sha256']==execution['source_storyboard_sha256']
          assert result['events'][-1]['new_ids']==['m_final']
          cuts=[e for e in result['events'] if e['transition']=='cut']
          assert len(cuts)>=3,cuts
          assert all(p['scale']>=.9 for e in result['events'] for p in e['placements'])
          print('NEW_QUESTION_CONTRACTS',len(result['events']),'CUTS',len(cuts))
          PY
      - name: Old animation module offline regressions
        run: cd animation_engine && python -m pytest -q -m 'not render'
  full-video:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install verified Manim/TeX/FFmpeg/CJK tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - name: Install director and actual renderer
        run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Independently verify original integral answer using SymPy
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          a=s.integrate(x*s.exp(x*x),(x,0,1))
          b=s.integrate(x*s.log(1+x*x),(x,0,1))
          c=s.integrate(x*x,(x,0,1))
          assert s.simplify(a-(s.E-1)/2)==0
          assert s.simplify(b-(s.log(2)-s.Rational(1,2)))==0
          assert s.simplify(c-s.Rational(1,3))==0
          assert s.simplify(a+b+c-(s.E/2+s.log(2)-s.Rational(2,3)))==0
          print('ORIGINAL_INTEGRAL_PROVED',a,b,c,s.simplify(a+b+c))
          PY
      - name: Construct independently authored new lesson end to end
        run: |
          mkdir -p longboard-evidence
          python animation_engine/tools/build_fresh_integral_acceptance.py --output longboard-evidence
      - name: Generate ACTUAL MathTex measured full event plan
        run: |
          math-animation plan-longboard --storyboard longboard-evidence/storyboard.json --execution longboard-evidence/execution.json --policy animation_engine/examples/new_integral_acceptance_policy.json --output longboard-evidence/longboard.json
          python - <<'PY'
          from pathlib import Path
          import json
          src=json.loads(Path('longboard-evidence/storyboard.json').read_text())
          r=json.loads(Path('longboard-evidence/longboard.json').read_text())
          assert len(src['scenes'])==len(r['events'])==20
          assert r['events'][-1]['new_ids']==['m_final']
          cuts=[e['event_id'] for e in r['events'] if e['transition']=='cut']
          scrolls=[e['event_id'] for e in r['events'] if e['transition']=='scroll']
          assert len(cuts)>=3,('NO_CUTS',cuts)
          assert all(z['placements'] for z in r['events'] if z['new_ids'])
          assert not any(p['scale']<.9 for e in r['events'] for p in e['placements'])
          print('2_4_REAL_LAYOUT',len(r['events']),'CUTS',cuts,'SCROLLS',scrolls)
          PY
      - name: Render REAL complete Manim classroom MP4 with fixed question
        run: |
          math-animation render-longboard --storyboard longboard-evidence/storyboard.json --execution longboard-evidence/execution.json --policy animation_engine/examples/new_integral_acceptance_policy.json --output longboard-evidence/new_integral_complete.mp4 --manifest longboard-evidence/video_manifest.json --fps 30
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json longboard-evidence/new_integral_complete.mp4 > longboard-evidence/ffprobe.json
      - name: Extract REAL preview keyframes and check content/provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          root=Path('longboard-evidence')
          meta=json.loads((root/'video_manifest.json').read_text())
          info=json.loads((root/'ffprobe.json').read_text())['streams'][0]
          assert info['width']==1280 and info['height']==720
          assert int(info['nb_read_frames'])>=180
          assert info['r_frame_rate']=='30/1'
          assert len(meta['event_timing'])==20
          assert meta['subtitle_status']=='not_rendered_no_audio'
          assert meta['source_storyboard_sha256']==json.loads((root/'execution.json').read_text())['source_storyboard_sha256']
          cuts=[x for x in meta['event_timing'] if x['transition']=='cut']
          assert len(cuts)>=3
          assert any(x['event_id']=='e_final' for x in meta['event_timing'])
          print('REAL_VIDEO_2_4',info['nb_read_frames'],'CUTS',cuts)
          for event_id in ['e_a_done','e_b_done','e_c_done','e_final']:
              row=next(x for x in meta['event_timing'] if x['event_id']==event_id)
              t=(row['start_preview_second']+row['end_preview_second'])/2
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                '-ss',str(t),'-i',str(root/'new_integral_complete.mp4'),
                '-frames:v','1',str(root/(event_id+'.png'))],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step-2-4-original-integral-full-classroom
          path: longboard-evidence/
          if-no-files-found: warn
