name: Animation adaptive layout step 2.3
on:
  push:
    branches: [feature/animation-engine-v1-step2-3]
  pull_request:
    paths:
      - 'animation_engine/**'
      - '.github/workflows/animation-layout-step2-3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: New 2.3 layout tests excluding optional real renderer
        run: cd animation_engine && python -m pytest tests/test_adaptive_layout.py -q -m "not render"
      - name: Transition movement safety tests
        run: cd animation_engine && python -m pytest tests/test_layout_transition.py -q -m "not render"
      - name: Source-exact header validation (offline)
        run: cd animation_engine && python -m pytest tests/test_classroom_compositor.py -q -m "not render"
      - name: Full backward-compatibility regressions
        run: |
          cd teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
          cd ../animation_engine && python -m pytest -q -m "not render"
  real-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install real LaTeX, Manim and FFmpeg dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Real glyph measurement and multi-formula PNG
        run: cd animation_engine && python -m pytest tests/test_adaptive_layout.py -q -m render
      - name: Real Chinese question and MathTex content integration
        run: cd animation_engine && python -m pytest tests/test_classroom_compositor.py -q -m render
      - name: True two-scene layout transition MP4 test
        run: cd animation_engine && python -m pytest tests/test_layout_transition.py -q -m render
      - name: Authentic storyboard and adaptive layout CLI artifact
        run: |
          mkdir -p layout-evidence
          visual-director plan visual_director/examples/limit_teaching_package.json --output layout-evidence/storyboard.json
          math-animation plan layout-evidence/storyboard.json --output layout-evidence/execution.json
          math-animation layout-board --storyboard layout-evidence/storyboard.json --execution layout-evidence/execution.json --output layout-evidence/layout.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("layout-evidence/layout.json").read_text(encoding="utf-8"))
          assert d["source_storyboard_sha256"] and d["layout_sha256"]
          assert d["timing_source"] == "semantic_anchors_only_not_audio_aligned"
          ready=[s for s in d["scenes"] if s["status"]=="ready" and s["placements"]]
          assert ready, "No valid layout exists"
          print("2.3_READY_SCENES", len(ready), "CUT_REQUIRED",
                sum(s["status"]=="cut_required" for s in d["scenes"]))
          Path("layout-evidence/event.txt").write_text(ready[0]["event_id"])
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          scenes=json.loads(Path("layout-evidence/layout.json").read_text(encoding="utf-8"))["scenes"]
          pair=next(((a,b) for a,b in zip(scenes, scenes[1:])
                     if a["status"]==b["status"]=="ready" and b["placements"]), None)
          assert pair is not None
          Path("layout-evidence/from-event.txt").write_text(pair[0]["event_id"])
          Path("layout-evidence/to-event.txt").write_text(pair[1]["event_id"])
          PY
          math-animation render-layout-transition --storyboard layout-evidence/storyboard.json --execution layout-evidence/execution.json --from-event-id "$(cat layout-evidence/from-event.txt)" --to-event-id "$(cat layout-evidence/to-event.txt)" --output layout-evidence/transition.mp4 --manifest layout-evidence/transition.json
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of json layout-evidence/transition.mp4
          EVENT_ID="$(cat layout-evidence/event.txt)"
          math-animation layout-board --storyboard layout-evidence/storyboard.json --execution layout-evidence/execution.json --event-id "$EVENT_ID" --output layout-evidence/board.png --manifest layout-evidence/board.json
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("layout-evidence")
          assert (folder/"board.png").read_bytes().startswith(b"\x89PNG\r\n\x1a\n")
          manifest=json.loads((folder/"board.json").read_text(encoding="utf-8"))
          assert manifest["preview_kind"]=="real_mathtex_static_layout"
          assert manifest["header_caption_status"]=="reserved_not_drawn"
          print("REAL_MANIM_LAYOUT", manifest["preview_event_id"])
          PY
      - name: Human-readable 2.3 actual lesson and controlled stress acceptance
        run: |
          python animation_engine/tools/build_visual_acceptance.py --output layout-evidence/showcase
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("layout-evidence/showcase")
          report=json.loads((root/"acceptance_report.json").read_text(encoding="utf-8"))
          assert len(report["panels"]) == 4
          assert report["real_lesson"]["held_ids"]
          assert len(report["controlled_stress"]["moved_ids"]) >= 2
          assert report["cut_required_count"] > 0
          from PIL import Image
          with Image.open(root/"acceptance_gallery.png") as im:
              assert im.width > 1500 and im.height > 1000
          print("HUMAN_VISUAL_ACCEPTANCE",report["real_lesson"],report["controlled_stress"])
          PY
          math-animation preview-classroom --storyboard layout-evidence/storyboard.json --execution layout-evidence/execution.json --event-id e_k_eqv --output layout-evidence/showcase/real_classroom_question.png --manifest layout-evidence/showcase/real_classroom_question.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("layout-evidence/showcase")
          x=json.loads((root/"real_classroom_question.json").read_text(encoding="utf-8"))
          assert x["question_parts"]["math_latex"].startswith("\\lim")
          assert x["header_caption_status"].startswith("question_rendered")
          assert x["speech_subtitle_status"]=="not_rendered_no_audio"
          assert x["header_display_scale"]>=0.9
          PY
          for file in layout-evidence/showcase/*.mp4; do
            ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of json "$file"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-2-3-real-mathtex-layout
          path: |
            layout-evidence/layout.json
            layout-evidence/board.png
            layout-evidence/board.json
            layout-evidence/event.txt
            layout-evidence/transition.mp4
            layout-evidence/transition.json
            layout-evidence/showcase/
          if-no-files-found: warn
