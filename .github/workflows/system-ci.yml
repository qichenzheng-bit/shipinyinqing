name: System CI · non-render classroom, teacher, animation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-source-and-script:
    name: Windows-only source and classroom validation
    runs-on: windows-latest
    env:
      # Runner-only preinstalled PostgreSQL 17. Never a real user DB.
      WEIGUANG_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:root@127.0.0.1:5432/postgres
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install source packages without video-render extras
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]' -e './backend[test]'
      - name: Validate Windows frontend JavaScript syntax
        run: node --check frontend/app.js
      - name: Start isolated PostgreSQL 17 on Windows CI
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          $env:PGPASSWORD = 'root'
          $psql = Join-Path $env:PGBIN 'psql.exe'
          & $psql -h 127.0.0.1 -U postgres -d postgres -tAc 'SELECT 1'
          if ($LASTEXITCODE -ne 0) { throw 'POSTGRESQL_17_NOT_AVAILABLE_IN_WINDOWS_CI' }
      - name: Verify Windows-only source inventory and docs
        run: python tools/repository_audit.py
      - name: Verify Windows Docker Desktop Compose configuration
        env:
          POSTGRES_PASSWORD: ci_only_url_safe_password
          WEIGUANG_API_TOKEN: ci_only_do_not_deploy
        run: docker compose config --quiet
      - name: Validate approved V2.7 lesson and Windows source integrity
        run: python tools/windows_release_validate.py
      - name: Run Windows Python source and regression checks
        shell: pwsh
        run: |
          Push-Location animation_engine
          python -m pytest -q -m "not render"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location teacher_module
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location visual_director
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location backend
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
