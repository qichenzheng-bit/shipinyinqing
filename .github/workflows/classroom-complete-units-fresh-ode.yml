name: Real teacher units - fresh ODE complete derivation acceptance
on:
  push:
    branches: [feature/complete-teaching-units-ode-first-principles]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teaching-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]'
      - name: Complete teacher goals and multi-MathTex steps are all verified
        run: cd animation_engine && python -m pytest tests/test_complete_teaching_units.py -q
      - name: Entire previous math animation module regression
        run: cd animation_engine && python -m pytest -q -m 'not render'
  fresh-manim-classroom:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install genuine MathTex, Manim, CJK font and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]' sympy
      - name: Independently verify new differential equation and IVP
        run: |
          python - <<'PY'
          import sympy as sp
          x=sp.symbols('x',real=True)
          y=sp.Function('y')
          ode=sp.Eq(sp.diff(y(x),x)+2*x*y(x),2*x)
          solution=sp.dsolve(ode,ics={y(0):0})
          expected=1-sp.exp(-x**2)
          assert sp.simplify(solution.rhs-expected)==0,(solution,expected)
          assert sp.simplify(sp.diff(expected,x)+2*x*expected-2*x)==0
          assert expected.subs(x,0)==0
          integrating_factor=sp.exp(sp.integrate(2*x,x))
          assert sp.simplify(integrating_factor-sp.exp(x**2))==0
          print('NEW_IVP_SYMBOLICALLY_VERIFIED',solution)
          PY
      - name: Create source-verified NEW grouped teacher lesson
        run: |
          mkdir -p ode-classroom-evidence
          python animation_engine/tools/build_complete_ode_lesson.py --output ode-classroom-evidence
      - name: Real MathTex glyph board plan keeps meaningful unit unbroken
        run: |
          math-animation plan-longboard --storyboard ode-classroom-evidence/storyboard.json --execution ode-classroom-evidence/execution.json --policy ode-classroom-evidence/page_policy.json --classroom-cues ode-classroom-evidence/teacher_approved_cues.json --output ode-classroom-evidence/board_pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ode-classroom-evidence')
          plan=json.loads((p/'board_pages.json').read_text())
          assert plan['event_count']==4
          assert len(plan['math_written_ids'])==11
          assert plan['page_count']>=2
          assert plan['mode']=='persistent_chalkboard'
          counts=[]
          live=set()
          for e in plan['events']:
              if e['erase_before']:
                  live=set()
              newly=[b for b in e['added_blocks'] if
                     b['kind']=='math' and not b.get('carry')]
              counts.append(len(newly))
              for b in e['added_blocks']:
                  assert b['block_id'] not in live
                  assert b['y']>=148 and b['y']+b['h']<=620
                  live.add(b['block_id'])
              assert set(e['visible_block_ids'])==live
          assert counts==[1,4,3,3],counts
          assert plan['events'][1]['event_id']=='e_derive'
          assert {'m_product_rule','m_combined','m_integrated'}.issubset(
              {b['block_id'] for b in plan['events'][1]['added_blocks']})
          print('NEW_ODE_4_UNITS_11_COMPLETE_FORMULAS',plan['page_count'],'pages')
          PY
      - name: Regression-check corrected earlier Taylor teaching with real MathTex
        run: |
          mkdir -p ode-classroom-evidence/revised-taylor
          python animation_engine/tools/build_fresh_taylor_classroom.py --output ode-classroom-evidence/revised-taylor
          math-animation plan-longboard --storyboard ode-classroom-evidence/revised-taylor/storyboard.json --execution ode-classroom-evidence/revised-taylor/execution.json --policy ode-classroom-evidence/revised-taylor/page_policy.json --classroom-cues ode-classroom-evidence/revised-taylor/teacher_approved_cues.json --output ode-classroom-evidence/revised-taylor/board_pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('ode-classroom-evidence/revised-taylor')
          layout=json.loads((p/'board_pages.json').read_text())
          assert layout['event_count']==5
          assert len(layout['math_written_ids'])==12
          product=next(e for e in layout['events'] if e['event_id']=='e_product')
          assert product['math_write_count']==3
          assert len([b for b in product['added_blocks']
              if b['kind']=='math' and not b.get('carry')])==3
          assert 'm_product_terms' in layout['math_written_ids']
          print('REVISED_TAYLOR_MISSING_MULTIPLICATION_FIXED')
          PY
      - name: 'Render independent ODE lesson to actual Manim classroom MP4'
        run: |
          math-animation render-longboard --storyboard ode-classroom-evidence/storyboard.json --execution ode-classroom-evidence/execution.json --policy ode-classroom-evidence/page_policy.json --classroom-cues ode-classroom-evidence/teacher_approved_cues.json --output ode-classroom-evidence/ode_teaching_classroom.mp4 --manifest ode-classroom-evidence/video_manifest.json --fps 30
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json ode-classroom-evidence/ode_teaching_classroom.mp4 > ode-classroom-evidence/ffprobe.json
      - name: Capture actual reasoning unit, product rule, initial value and verification scenes
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('ode-classroom-evidence')
          m=json.loads((root/'video_manifest.json').read_text())
          probe=json.loads((root/'ffprobe.json').read_text())['streams'][0]
          assert probe['width']==1280 and probe['height']==720
          assert probe['r_frame_rate']=='30/1'
          assert int(probe['nb_read_frames'])>500
          assert m['event_count']==4 and len(m['event_timing'])==4
          assert m['in_page_fadeout_count']==m['in_page_reposition_count']==0
          assert m['erase_count']==m['page_count']-1
          assert m['voice_status']=='not_recorded'
          assert m['source_storyboard_sha256']==json.loads(
              (root/'execution.json').read_text())['source_storyboard_sha256']
          unit_ids=['e_method','e_derive','e_initial','e_verify']
          capture=[]
          for u in unit_ids:
              row=next(x for x in m['event_timing'] if x['event_id']==u)
              t=row['end_preview_second']-.23
              capture.append((u,t))
          wipes=[i for i,r in enumerate(m['event_timing']) if r['erase_before']]
          if wipes:
              idx=wipes[0]
              capture.append(('before_wipe',
                m['event_timing'][idx-1]['end_preview_second']-.20))
              capture.append(('after_wipe',
                m['event_timing'][idx]['end_preview_second']-.20))
          for label,t in capture:
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-ss',str(max(t,0)),'-i',str(root/'ode_teaching_classroom.mp4'),
                  '-frames:v','1',str(root/(label+'.png'))],check=True)
              assert Image.open(root/(label+'.png')).size==(1280,720)
          mosaic=Image.new('RGB',(1280,1185),'#EDF1F5')
          draw=ImageDraw.Draw(mosaic)
          for j,(label,t) in enumerate(capture):
              x=(j%2)*640;y=(j//2)*395+25
              mosaic.paste(Image.open(root/(label+'.png')).convert('RGB').resize((640,360)),(x,y))
              draw.text((x+10,y-18),label,fill='#111111')
          mosaic.save(root/'new_ode_teaching_six_stages.png')
          print('COMPLETE_ODE_CLASSROOM_ACCEPTED',m['event_count'],
                'units',len(m['math_written_ids']),'math lines',
                m['page_count'],'pages',probe['nb_read_frames'],'frames')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ode-new-problem-complete-units-real-classroom
          path: ode-classroom-evidence/
          if-no-files-found: warn
