name: WeiGuang Math Windows Desktop installer
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'animation_engine/**'
      - 'teacher_module/**'
      - 'visual_director/**'
      - 'docker-compose.yml'
      - '.github/workflows/windows-desktop.yml'
      - 'tools/build_source_release.py'
      - 'tools/build_source_release.py'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'animation_engine/**'
      - 'teacher_module/**'
      - 'visual_director/**'
      - 'docker-compose.yml'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows-installers:
    name: Windows 11 native setup EXE + maintainable source ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_DISABLE_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate brand app ICO and PNG
        shell: pwsh
        run: |
          python -m pip install Pillow
          python desktop/tools/generate_app_icon.py --output desktop/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Electron / Windows packager
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop URL/security rules
        working-directory: desktop
        run: npm test
      - name: Launch real Windows Electron window and screenshot both modes
        working-directory: desktop
        run: npm run test:native
      - name: Create signed-off source inventory (no production data)
        shell: pwsh
        run: |
          python tools/repository_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the sole Windows setup installer
        working-directory: desktop
        run: npm run build:windows
      - name: Verify installer files and exact packaged production modules
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne '1.0.4') { throw 'DESKTOP_PACKAGE_VERSION_MISMATCH' }
          $installers = @(Get-ChildItem desktop/dist/*.exe)
          $setup = @($installers | Where-Object { $_.Name -eq 'WeiGuang-Math-Setup-1.0.4-x64.exe' })
          if ($setup.Count -ne 1 -or $installers.Count -ne 1) {
            throw 'EXACTLY_ONE_SETUP_EXE_REQUIRED_AND_PORTABLE_FORBIDDEN'
          }
          foreach ($file in $installers) {
            if ($file.Length -lt 25000000) { throw "SUSPICIOUSLY_SMALL_APP: $($file.Name)" }
          }
          $sourceRoot = 'desktop/dist/win-unpacked/resources/service'
          foreach ($path in @(
            'docker-compose.yml', 'backend/Dockerfile',
            'backend/src/weiguang_backend/main.py',
            'animation_engine/src/animation_engine/spoken_movie.py',
            'teacher_module/src/math_teacher/prompts/global.md',
            'visual_director/src/visual_director/director.py',
            'frontend/logo.svg',
            'frontend/app.js'
          )) {
            if (!(Test-Path (Join-Path $sourceRoot $path))) {
              throw "DESKTOP_BACKEND_RESOURCE_MISSING: $path"
            }
          }
          if (Test-Path (Join-Path $sourceRoot 'backend/tests')) { throw 'PACKAGED_TESTS_NOT_ALLOWED' }
          if (Test-Path (Join-Path $sourceRoot 'frontend/screenshots')) { throw 'PACKAGED_SCREENSHOTS_NOT_ALLOWED' }
          if (Test-Path (Join-Path $sourceRoot '.env')) { throw 'PACKAGED_SECRETS_NOT_ALLOWED' }
          $installer = (Resolve-Path 'desktop/dist/WeiGuang-Math-Setup-1.0.4-x64.exe').Path
          Write-Output "WINDOWS_NATIVE_INSTALLER_ACCEPTANCE_OK"
      - name: Build one source-code ZIP tied to the exact installer
        shell: pwsh
        run: |
          python tools/build_source_release.py `
            --setup desktop/dist/WeiGuang-Math-Setup-1.0.4-x64.exe `
            --output desktop/dist/WeiGuang-Math-Source-1.0.4.zip `
            --version 1.0.4 --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Final exact-two-file release gate
        shell: pwsh
        run: |
          $installer = 'desktop/dist/WeiGuang-Math-Setup-1.0.4-x64.exe'
          $source = 'desktop/dist/WeiGuang-Math-Source-1.0.4.zip'
          if (!(Test-Path $installer) -or !(Test-Path $source)) { throw 'TWO_REQUIRED_FILES_MISSING' }
          if (@(Get-ChildItem desktop/dist/*.exe).Count -ne 1) { throw 'EXTRA_WINDOWS_INSTALLER_OR_PORTABLE' }
          if (@(Get-ChildItem desktop/dist/*.zip).Count -ne 1) { throw 'EXTRA_SOURCE_ARCHIVES' }
          if ((Get-Item $installer).Length -lt 25000000) { throw 'INSTALLER_UNEXPECTEDLY_SMALL' }
          if ((Get-Item $source).Length -lt 25000) { throw 'SOURCE_ARCHIVE_UNEXPECTEDLY_SMALL' }
          Get-FileHash $installer,$source -Algorithm SHA256 | Select-Object Path,Hash
          Write-Output "EXACTLY_TWO_WINDOWS_RELEASE_FILES_ACCEPTED"
      - uses: actions/upload-artifact@v4
        with:
          name: WeiGuang-Math-Windows-v1.0.4-Installer-and-Source
          path: |
            desktop/dist/WeiGuang-Math-Setup-1.0.4-x64.exe
            desktop/dist/WeiGuang-Math-Source-1.0.4.zip
          if-no-files-found: error
          retention-days: 30
