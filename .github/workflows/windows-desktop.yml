name: WeiGuang Math Windows Desktop installer
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'animation_engine/**'
      - 'teacher_module/**'
      - 'visual_director/**'
      - 'docker-compose.yml'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'backend/**'
      - 'frontend/**'
      - 'animation_engine/**'
      - 'teacher_module/**'
      - 'visual_director/**'
      - 'docker-compose.yml'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  windows-installers:
    name: Windows 11 native installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_BUILDER_DISABLE_PUBLISH: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate brand app ICO and PNG
        shell: pwsh
        run: |
          python -m pip install Pillow
          python desktop/tools/generate_app_icon.py --output desktop/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned Electron / Windows packager
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Validate desktop URL/security rules
        working-directory: desktop
        run: npm test
      - name: Launch real Windows Electron window and screenshot both modes
        working-directory: desktop
        run: npm run test:native
      - name: Create signed-off source inventory (no production data)
        shell: pwsh
        run: |
          python tools/repository_audit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows setup and portable executables
        working-directory: desktop
        run: npm run build:windows
      - name: Verify installer files and exact packaged production modules
        shell: pwsh
        run: |
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne '1.0.1') { throw 'DESKTOP_PACKAGE_VERSION_MISMATCH' }
          $installers = @(Get-ChildItem desktop/dist/*.exe)
          $setup = @($installers | Where-Object { $_.Name -match 'Setup-' })
          $portable = @($installers | Where-Object { $_.Name -match 'Portable-' })
          if ($setup.Count -ne 1 -or $portable.Count -ne 1) {
            Write-Error "EXPECTED_ONE_WINDOWS_SETUP_AND_PORTABLE"
            exit 1
          }
          foreach ($file in $installers) {
            if ($file.Length -lt 25000000) { throw "SUSPICIOUSLY_SMALL_APP: $($file.Name)" }
          }
          $sourceRoot = 'desktop/dist/win-unpacked/resources/service'
          foreach ($path in @(
            'docker-compose.yml', 'backend/Dockerfile',
            'backend/src/weiguang_backend/main.py',
            'animation_engine/src/animation_engine/spoken_movie.py',
            'teacher_module/src/math_teacher/prompts/global.md',
            'visual_director/src/visual_director/director.py',
            'frontend/logo.svg',
            'frontend/app.js'
          )) {
            if (!(Test-Path (Join-Path $sourceRoot $path))) {
              throw "DESKTOP_BACKEND_RESOURCE_MISSING: $path"
            }
          }
          if (Test-Path (Join-Path $sourceRoot 'backend/tests')) { throw 'PACKAGED_TESTS_NOT_ALLOWED' }
          if (Test-Path (Join-Path $sourceRoot 'frontend/screenshots')) { throw 'PACKAGED_SCREENSHOTS_NOT_ALLOWED' }
          if (Test-Path (Join-Path $sourceRoot '.env')) { throw 'PACKAGED_SECRETS_NOT_ALLOWED' }
          Get-ChildItem desktop/dist/*.exe | Select-Object Name,Length
          $checks = Get-ChildItem desktop/dist/*.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checks | Out-File -FilePath desktop/dist/SHA256SUMS.txt -Encoding utf8
          $manifest = @{
            product = '微光数学'
            platform = 'Windows'
            version = $package.version
            architecture = 'x64'
            source_sha = $env:GITHUB_SHA
            installer = "WeiGuang-Math-Setup-$($package.version)-x64.exe"
            portable = "WeiGuang-Math-Portable-$($package.version)-x64.exe"
            signing = 'unsigned; code-signing certificate required for trusted public distribution'
            backend_required = 'Local Docker Desktop + WSL2, or existing HTTPS server'
            includes_video_render_engine_source = $true
            includes_installed_Docker_or_model_API_keys = $false
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content desktop/dist/app-manifest.json -Encoding utf8
          Write-Output "WINDOWS_NATIVE_INSTALLER_ACCEPTANCE_OK"
      - uses: actions/upload-artifact@v4
        with:
          name: WeiGuang-Math-Windows-1.0.1-App
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
            desktop/dist/app-manifest.json
            desktop/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
