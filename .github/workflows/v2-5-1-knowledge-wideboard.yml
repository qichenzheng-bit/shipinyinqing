name: V2.5.1 knowledge-first wideboard and regression
on:
  push:
    branches: [fix/v2-5-1-knowledge-wideboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install all modules
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Verify multi-part semantics and edge cases
        run: cd animation_engine && python -m pytest tests/test_computation_groups.py tests/test_integral_knowledge_wideboard.py -q
      - name: All teacher regression
        run: cd teacher_module && python -m pytest -q
      - name: All director regression
        run: cd visual_director && python -m pytest -q
      - name: All animation regression
        run: cd animation_engine && python -m pytest -q -m 'not render'
      - name: Python syntax and packaging verification
        run: python -m compileall -q teacher_module/src visual_director/src animation_engine/src animation_engine/tools
  actual-real-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install Manim, genuine LaTeX, FFmpeg and Chinese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test]' sympy
      - name: Independently verify three NEW exact integrals and intermediate results
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          vA=s.integrate(x*s.exp(x)+x/(1+x*x)+x*x,(x,0,1))
          vB=s.integrate(x+x*x*s.exp(x)+s.sin(x),(x,0,1))
          vC=s.integrate(x*s.exp(x)+x/(1+x*x)+x*x+s.sin(x)+s.exp(x),(x,0,1))
          assert s.simplify(vA-(s.Rational(4,3)+s.log(2)/2))==0
          assert s.simplify(vB-(s.E-s.Rational(1,2)-s.cos(1)))==0
          assert s.simplify(vC-(s.E+s.Rational(4,3)+s.log(2)/2-s.cos(1)))==0
          assert s.integrate(x*s.exp(x),(x,0,1))==1
          assert s.integrate(x/(1+x*x),(x,0,1))==s.log(2)/2
          assert s.simplify(s.integrate(x*x*s.exp(x),(x,0,1))-(s.E-2))==0
          print("THREE_NEW_INTEGRALS_VERIFIED",vA,vB,vC)
          PY
      - name: Generate A B and C with source-verified teacher and result ledger
        run: |
          for V in A B C; do
            mkdir -p "multi-part-evidence/$V"
            python animation_engine/tools/build_multipart_integral_lesson.py --variant "$V" --output "multi-part-evidence/$V"
          done
      - name: Real MathTex measurement and semantic page plans for all variants
        run: |
          for V in A B C; do
            P="multi-part-evidence/$V"
            math-animation plan-longboard --storyboard "$P/storyboard.json" --execution "$P/execution.json" --classroom-cues "$P/teacher_approved_cues.json" --policy "$P/page_policy.json" --computation-groups "$P/computation_groups.json" --output "$P/board_pages.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("multi-part-evidence")
          for variant,part_count in [("A",3),("B",3),("C",5)]:
              p=root/variant
              l=json.loads((p/"board_pages.json").read_text())
              assert l["computation_groups"]["part_count"]==part_count
              assert l["events"][-1]["computation_role"]=="final"
              assert l["events"][0]["computation_role"]=="decomposition"
              writes=set()
              page=1
              for event in l["events"]:
                  assert event["page_index"]>=page
                  if event["erase_before"]:
                      assert event["page_index"]==page+1
                      assert event["erase_reason"]=="whole_reasoning_unit_cannot_fit"
                      assert set(event["carry_object_ids"]).issubset(writes)
                  page=event["page_index"]
                  for block in event["added_blocks"]:
                      assert block["y"]+block["h"]<=620
                      if block["kind"]=="math" and not block.get("carry"):
                          assert block["block_id"] not in writes
                          writes.add(block["block_id"])
              results={x["result_object_id"] for x in l["computation_groups"]["ordered_parts"]}
              assert results.issubset(writes)
              assert "m_final" in writes
              print("ACTUAL_GLYPH_PLAN",variant,l["page_count"],"pages",len(writes),"writes")
          b=json.loads((root/"B"/"board_pages.json").read_text())
          first=next(e for e in b["events"] if e["event_id"]=="e_i2start")
          second=next(e for e in b["events"] if e["event_id"]=="e_i2finish")
          if second["erase_before"]:
              assert "m_i2_checkpoint" in second["carry_object_ids"]
              assert b["events"][2]["subproblem_id"]=="I2"
          print("DOUBLE_INTEGRATION_BY_PARTS_CONTINUITY_VERIFIED")
          PY
      - name: 'Render actual 30 FPS MP4 - A mixed three parts and B long nested integration'
        run: |
          for V in A B; do
            P="multi-part-evidence/$V"
            math-animation render-longboard --storyboard "$P/storyboard.json" --execution "$P/execution.json" --classroom-cues "$P/teacher_approved_cues.json" --policy "$P/page_policy.json" --computation-groups "$P/computation_groups.json" --output "$P/multi_part_classroom.mp4" --manifest "$P/video_manifest.json" --fps 30
            ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json "$P/multi_part_classroom.mp4" > "$P/ffprobe.json"
          done
      - name: Extract actual rendered video evidence from important scenes
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path("multi-part-evidence")
          captures=[]
          for variant in ("A","B"):
              p=root/variant
              m=json.loads((p/"video_manifest.json").read_text())
              probe=json.loads((p/"ffprobe.json").read_text())["streams"][0]
              assert (probe["width"],probe["height"],probe["r_frame_rate"])==(1280,720,"30/1")
              assert int(probe["nb_read_frames"])>800
              assert m["computation_groups"]["part_count"]==3
              assert m["erase_count"]==m["page_count"]-1
              assert m["in_page_reposition_count"]==m["in_page_fadeout_count"]==0
              assert m["voice_status"]=="not_recorded"
              assert m["event_count"]==len(m["event_timing"])
              for eid in (("e_split","e_i1","e_i2","e_final") if variant=="A"
                          else ("e_i2start","e_i2finish","e_final")):
                  e=next(row for row in m["event_timing"] if row["event_id"]==eid)
                  t=max(0,e["end_preview_second"]-.2)
                  target=p/(eid+".png")
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                      "-ss",str(t),"-i",str(p/"multi_part_classroom.mp4"),
                      "-frames:v","1",str(target)],check=True)
                  assert Image.open(target).size==(1280,720)
                  captures.append((variant+" "+eid,Image.open(target).convert("RGB")))
              print("REAL_MULTIPART_MOVIE_PASS",variant,probe["nb_read_frames"],
                    "frames",m["page_count"],"pages")
          columns=2
          canvas=Image.new("RGB",(1280,((len(captures)+1)//2)*390),"#F0F2F5")
          draw=ImageDraw.Draw(canvas)
          for i,(label,frame) in enumerate(captures):
              x=(i%2)*640;y=(i//2)*390+25
              canvas.paste(frame.resize((640,360)),(x,y))
              draw.text((x+9,y-20),label,fill="#111111")
          canvas.save(root/"V2_5_1_real_classroom_comparison.png")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-5-1-knowledge-wideboard-a-b-mp4-evidence
          path: multi-part-evidence/
          if-no-files-found: warn
