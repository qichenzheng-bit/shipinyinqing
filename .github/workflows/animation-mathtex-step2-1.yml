name: Animation MathTex 2.1 real-render tests
on:
  push:
    branches:
      - feature/animation-engine-v1-step2-1
  pull_request:
    paths:
      - 'animation_engine/**'
      - '.github/workflows/animation-mathtex-step2-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]' -e './teacher_module[test]'
      - name: Contract RED/GREEN and full regression
        run: |
          cd animation_engine && python -m pytest tests/test_render_contract.py -q
          python -m pytest -q
          cd ../visual_director && python -m pytest -q
          cd ../teacher_module && python -m pytest -q
  real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real TeX and Manim system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript
      - name: Install render extra with pinned Manim
        run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Verify actual MathTex compilation and metrics
        run: cd animation_engine && timeout 180s python -m pytest tests/test_mathtex_renderer.py -q
