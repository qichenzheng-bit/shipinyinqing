name: Animation MathTex 2.1 real-render tests
on:
  push:
    branches:
      - feature/animation-engine-v1-step2-1
  pull_request:
    paths:
      - 'animation_engine/**'
      - '.github/workflows/animation-mathtex-step2-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]' -e './teacher_module[test]'
      - name: Contract RED/GREEN and full regression
        run: |
          cd animation_engine && python -m pytest tests/test_render_contract.py -q
          python -m pytest -q
          cd ../visual_director && python -m pytest -q
          cd ../teacher_module && python -m pytest -q
  real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real TeX and Manim system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript
      - name: Install render extra with pinned Manim
        run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Verify actual MathTex compilation, pixels, CLI and bounds
        run: |
          cd animation_engine
          timeout 240s python -m pytest tests/test_mathtex_renderer.py tests/test_math_preview.py -q
      - name: Generate preview from actual 19-scene contracts
        run: |
          mkdir -p render-evidence
          visual-director plan visual_director/examples/limit_teaching_package.json --output render-evidence/storyboard.json
          math-animation plan render-evidence/storyboard.json --output render-evidence/execution.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          p=Path("render-evidence")
          exe=json.loads((p/"execution.json").read_text(encoding="utf-8"))
          scene=next(s for s in exe["scenes"] if "m_d_sin" in s["visible_ids"])
          subprocess.run(["math-animation","preview-math","--storyboard",str(p/"storyboard.json"),
            "--execution",str(p/"execution.json"),"--event-id",scene["event_id"],
            "--object-id","m_d_sin","--output",str(p/"math.png"),
            "--metrics",str(p/"math.json")],check=True,timeout=120)
          from PIL import Image
          with Image.open(p/"math.png") as im:
            assert im.size==(1280,720)
            assert im.convert("RGB").getpixel((0,0))==(255,255,255)
          meta=json.loads((p/"math.json").read_text(encoding="utf-8"))
          assert meta["object_id"]=="m_d_sin"
          assert meta["render_kind"]=="manim_mathtex_static_png"
          print("REAL_PNG_OK",scene["event_id"],meta["formula_bounds_px"])
          PY
      - name: Save actual typeset fraction, limit, integral and matrix examples
        run: |
          python - <<'PY'
          from pathlib import Path
          from manim import Camera, tempconfig
          from animation_engine.mathtex_renderer import build_measured_mathtex
          samples = {
            "fraction": r"\\frac{a+b}{c+d}",
            "limit": r"\\displaystyle\\lim\\limits_{x\\to0}\\frac{\\sin x}{x}",
            "integral": r"\\int_0^1 x\\,dx=\\frac12",
            "matrix": r"\\begin{pmatrix}1&2\\\\3&4\\end{pmatrix}",
          }
          for name, latex in samples.items():
            glyphs, m = build_measured_mathtex(latex)
            assert 0 < m.width_units < 12 and 0 < m.height_units < 7
            glyphs.move_to([0,0,0])
            with tempconfig({"pixel_width":1280,"pixel_height":720,"frame_width":14.222222222222,"frame_height":8,"background_color":"#FFFFFF"}):
              camera=Camera()
              camera.capture_mobjects([glyphs])
              camera.get_image().save(Path("render-evidence") / (name + ".png"),format="PNG")
            print("RENDERED_EXAMPLE",name,m)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathtex-2-1-real-render-evidence
          path: |
            render-evidence/math.png
            render-evidence/math.json
            render-evidence/fraction.png
            render-evidence/limit.png
            render-evidence/integral.png
            render-evidence/matrix.png
          if-no-files-found: warn
