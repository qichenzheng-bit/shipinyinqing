name: Final QA - truly new log-limit lesson with 60 FPS real voice
on:
  push:
    branches: [qa/final-fresh-log-limit-60fps]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-lesson-script-and-code:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install source-validation dependencies
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Regression tests - NO media rendering
        run: |
          (cd animation_engine && python -m pytest -q -m 'not render')
          (cd teacher_module && python -m pytest -q)
          (cd visual_director && python -m pytest -q)
      - name: Independent mathematical and authentic narration review
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          f=(s.log(1+x)-x+x*x/2)/x**3
          assert s.limit(f,x,0)==s.Rational(1,3)
          assert s.series(s.log(1+x),x,0,4).removeO()==x-x*x/2+x**3/3
          print('INDEPENDENT_MATH_VERIFIED',s.limit(f,x,0))
          PY
          python animation_engine/tests/fixtures/build_independent_log_limit_final_qa.py --output qa-log-limit
          math-animation export-spoken-script --spoken qa-log-limit/spoken_classroom.json --output qa-log-limit/lesson_script.md
          python - <<'PY'
          import json
          from pathlib import Path
          from animation_engine.spoken_audio import split_natural_phrases
          from animation_engine.video_settings import DEFAULT_VIDEO_FPS
          root=Path('qa-log-limit')
          a=json.loads((root/'lesson_script.json').read_text('utf-8'))
          doc=json.loads((root/'spoken_classroom.json').read_text('utf-8'))
          assert DEFAULT_VIDEO_FPS==60
          assert a['acceptance']['contract_version']=='2.7'
          assert len(a['events'])==10
          assert [e['phase'] for e in a['events']]==['observe','strategy','knowledge','calculate','calculate','calculate','calculate','pitfall','conclusion','summary']
          byid={e['event_id']:e for e in a['events']}
          before=''.join(x['spoken_exact'] for x in byid['e_strategy']['actions'])
          assert before.index('低阶表达式')<before.index('泰勒展开')
          assert '为什么考虑泰勒' not in before
          assert '我们来读一下' not in ''.join(x['spoken_exact'] for x in byid['e_intro']['actions'])
          assert byid['e_conclusion']['actions'][-1]['board_math_latex']==r'L=\frac13'
          assert all(x['kind']!='math' for x in byid['e_summary']['actions'])
          for event in doc['events']:
            for span in event['spans']:
              for part in span['parts']:
                if part['kind']=='text':
                  assert ''.join(split_natural_phrases(part['value']))==part['value']
          assert '小 o' in (root/'lesson_script.md').read_text('utf-8')
          print('FRESH_FINAL_SCRIPT_APPROVED',len(a['events']),'events',a['acceptance'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-fresh-log-limit-pre-render-script
          path: |
            qa-log-limit/lesson_script.md
            qa-log-limit/lesson_script.json
            qa-log-limit/spoken_classroom.json
          if-no-files-found: warn
  real-60fps-teacher-video:
    needs: fresh-lesson-script-and-code
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install actual MathTex/Manim, Chinese font, neural voice, FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Build new question and export a validated script BEFORE TTS
        run: |
          python animation_engine/tests/fixtures/build_independent_log_limit_final_qa.py --output qa-log-limit
          math-animation export-spoken-script --spoken qa-log-limit/spoken_classroom.json --output qa-log-limit/lesson_script.md
      - name: Render actual original XiaoXiao neural voice, synchronized board, subtitles, 60fps MP4
        run: |
          math-animation render-spoken \
            --spoken qa-log-limit/spoken_classroom.json \
            --output qa-log-limit/lesson_60fps.mp4 \
            --manifest qa-log-limit/manifest.json \
            --srt qa-log-limit/lesson.srt \
            --fps 60
      - name: Verify independent mathematical result, true audio and video frame rate, full recap
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from sympy import symbols,log,limit,Rational
          x=symbols('x',real=True)
          assert limit((log(1+x)-x+x*x/2)/x**3,x,0)==Rational(1,3)
          root=Path('qa-log-limit')
          report=json.loads((root/'manifest.json').read_text('utf-8'))
          script=json.loads((root/'lesson_script.json').read_text('utf-8'))
          assert script['acceptance']['contract_version']=='2.7'
          assert len(report['event_timing'])==len(script['events'])==10
          assert report['voiced_action_count']>=10
          assert report['voice_status']=='real_edge_neural_pcm_verified'
          assert report['subtitle_status']=='actual_tts_phrase_aligned'
          assert report['fabricated_voice_or_subtitle_count']==0
          assert report['source_narration_action_count']==report['voiced_action_count']
          assert report['actual_video_frames']>60*40
          order={e['event_id']:i for i,e in enumerate(report['event_timing'])}
          assert order['e_strategy']<order['e_knowledge']<order['e_apply']
          assert order['e_conclusion']==8 and order['e_summary']==9
          actual_voice=''.join(c['actual_voice_text'] for c in report['caption_timing'])
          assert '同学们大家好' in actual_voice
          assert '最后我们简单回顾一下' in actual_voice
          assert 'L 等于三分之一' in actual_voice
          package=json.loads((root/'limit'/'teaching_package.json').read_text('utf-8'))
          assert any(obj['latex']==r'L=\frac13' for obj in package['lesson']['math_objects'])
          probe=json.loads(subprocess.check_output(
            ['ffprobe','-v','quiet','-show_streams','-show_format','-of','json',str(root/'lesson_60fps.mp4')]
          ))
          streams=probe['streams']
          assert {'audio','video'} <= {s['codec_type'] for s in streams}
          v=next(s for s in streams if s['codec_type']=='video')
          assert (int(v['width']),int(v['height']))==(1280,720)
          num,den=map(int,v['avg_frame_rate'].split('/'))
          assert num/den==60,(num,den)
          assert (root/'lesson.srt').stat().st_size>120
          summary={
            'independent_answer':'1/3','fps':60,
            'video_frames':report['actual_video_frames'],
            'total_video_seconds':float(probe['format']['duration']),
            'voiced_actions':report['voiced_action_count'],
            'teaching_events':len(report['event_timing']),
            'real_voice':report['voice_status'],
            'subtitles':report['subtitle_status'],
            'recap_separate_after_result':True,
            'source_integrity':'V2.7 pre-render full script approved',
          }
          (root/'final_qa.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('NEW_QUESTION_FINAL_60FPS_PASS',summary)
          PY
      - name: Save representative actual video frames for teaching review
        if: success()
        run: |
          mkdir -p qa-log-limit/screenshots
          duration=$(ffprobe -v quiet -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 qa-log-limit/lesson_60fps.mp4)
          ffmpeg -v error -y -ss 8 -i qa-log-limit/lesson_60fps.mp4 -frames:v 1 qa-log-limit/screenshots/01_opening.png
          ffmpeg -v error -y -ss 38 -i qa-log-limit/lesson_60fps.mp4 -frames:v 1 qa-log-limit/screenshots/02_strategy.png
          ffmpeg -v error -y -ss 72 -i qa-log-limit/lesson_60fps.mp4 -frames:v 1 qa-log-limit/screenshots/03_computation.png
          python - "$duration" <<'PY'
          import subprocess,sys
          value=float(sys.argv[1])
          sample=max(0,value-7)
          subprocess.run(['ffmpeg','-v','error','-y','-ss',str(sample),'-i','qa-log-limit/lesson_60fps.mp4',
             '-frames:v','1','qa-log-limit/screenshots/04_recap.png'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-fresh-log-limit-60fps-MP4-script-and-frames
          path: qa-log-limit/
          if-no-files-found: warn
