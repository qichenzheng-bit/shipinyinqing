name: Persistent classroom chalkboard - only erase when full
on:
  push:
    branches: [feature/classroom-persistent-chalkboard-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[test]'
      - name: Source-integrity, append-only and page-erase invariant tests
        run: cd animation_engine && python -m pytest tests/test_persistent_chalkboard.py -q
      - name: Backward compatibility with reference and other animation tests
        run: cd animation_engine && python -m pytest -q -m 'not render'
  full-video:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Actual Manim MathTex, FFmpeg, CJK font and LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - run: python -m pip install -e './visual_director[test]' -e './animation_engine[render,test]' sympy
      - name: Verify already approved lesson's original mathematical answer
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          assert s.simplify(s.integrate(x*x*s.log(1+x),(x,0,1)) -
              (s.Rational(2,3)*s.log(2)-s.Rational(5,18)))==0
          PY
      - name: Build same teacher-source lesson with no-disappearing-ink policy
        run: |
          mkdir -p persistent-evidence
          python animation_engine/tools/build_persistent_chalkboard_example.py --output persistent-evidence
      - name: Real glyph measurement, page filling and erase decision
        run: |
          math-animation plan-longboard --storyboard persistent-evidence/storyboard.json --execution persistent-evidence/execution.json --policy persistent-evidence/page_policy.json --classroom-cues persistent-evidence/teacher_approved_cues.json --output persistent-evidence/board_pages.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('persistent-evidence/board_pages.json').read_text())
          assert p['mode']=='persistent_chalkboard'
          assert p['event_count']==14
          assert p['page_count']>=2,p
          assert sum(x['erase_before'] for x in p['events'])==p['page_count']-1
          assert all(e['visible_block_ids'] for e in p['events'])
          assert any(x['block_id']=='m_final' for e in p['events'] for x in e['added_blocks'])
          previous=set()
          for e in p['events']:
              if e['erase_before']: previous=set()
              assert previous.issubset(e['visible_block_ids'])
              previous=set(e['visible_block_ids'])
          print('REAL_PERSISTENT_BOARD_PAGE_PLAN',p['page_count'],'PAGES')
          PY
      - name: 'Render real chalkboard: no step fades, no moving maths, erase only at full page'
        run: |
          math-animation render-longboard --storyboard persistent-evidence/storyboard.json --execution persistent-evidence/execution.json --policy persistent-evidence/page_policy.json --classroom-cues persistent-evidence/teacher_approved_cues.json --output persistent-evidence/persistent_classroom.mp4 --manifest persistent-evidence/video_manifest.json --fps 30
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json persistent-evidence/persistent_classroom.mp4 > persistent-evidence/ffprobe.json
      - name: Inspect rendered movie and capture before erase, after erase, final, knowledge
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path('persistent-evidence')
          m=json.loads((root/'video_manifest.json').read_text())
          info=json.loads((root/'ffprobe.json').read_text())['streams'][0]
          assert info['width']==1280 and info['height']==720 and info['r_frame_rate']=='30/1'
          assert int(info['nb_read_frames'])>1000
          assert m['event_count']==len(m['event_timing'])==14
          assert m['erase_count']>=1
          assert m['in_page_fadeout_count']==0
          assert m['in_page_reposition_count']==0
          assert m['voice_status']=='not_recorded'
          assert m['source_storyboard_sha256']==json.loads((root/'execution.json').read_text())['source_storyboard_sha256']
          phase=json.loads((root/'teacher_approved_cues.json').read_text())['events']
          selected=[]
          for eid in ['e_choice','e_parts','e_expand','e_final']:
              r=next(x for x in m['event_timing'] if x['event_id']==eid)
              t=r['end_preview_second']-.3
              selected.append((eid,t))
          first_clear=next(i for i,r in enumerate(m['event_timing']) if r['erase_before'])
          selected.append(('before_erase',m['event_timing'][first_clear-1]['end_preview_second']-.25))
          selected.append(('after_erase',m['event_timing'][first_clear]['end_preview_second']-.25))
          for name,t in selected:
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',
                  str(max(t,0)),'-i',str(root/'persistent_classroom.mp4'),
                  '-frames:v','1',str(root/(name+'.png'))],check=True)
              assert Image.open(root/(name+'.png')).size==(1280,720)
          canvas=Image.new('RGB',(1280,1180),'#E9EDF2')
          d=ImageDraw.Draw(canvas)
          for i,(name,t) in enumerate(selected):
              x=(i%2)*640;y=(i//2)*390+24
              canvas.paste(Image.open(root/(name+'.png')).convert('RGB').resize((640,360)),(x,y))
              d.text((x+10,y-20),name,fill='#111111')
          canvas.save(root/'chalkboard_six_frames.png')
          print('CHALKBOARD_VIDEO_PASS',info['nb_read_frames'],'frames',
                m['page_count'],'pages',m['erase_count'],'whole-board erasures')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-persistent-chalkboard-full-video
          path: persistent-evidence/
          if-no-files-found: warn
