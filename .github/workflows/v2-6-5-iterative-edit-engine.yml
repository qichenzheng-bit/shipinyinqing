name: V2.6.5 continuous natural-language video editing engine
on:
  push:
    branches: [feature/v2-6-5-iterative-edit-engine]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-6-5-edit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  continuous-edit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Multiple requirements, arbitrary languages, latest-only edits and rollback
        run: cd animation_engine && python -m pytest tests/test_iterative_edit_engine.py -q
      - name: All previous animation-engine regressions
        run: cd animation_engine && python -m pytest -q -m 'not render'
      - name: Teacher and visual-director regressions
        run: |
          cd teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
      - run: python -m compileall -q animation_engine/src animation_engine/tools teacher_module/src visual_director/src

  two-real-voice-revisions:
    needs: continuous-edit-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install real voice and true MathTex rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Generate verified actual voice baseline
        run: |
          python animation_engine/tools/build_spoken_triangle.py --output edit-evidence/base
          math-animation render-spoken --spoken edit-evidence/base/spoken_classroom.json --output edit-evidence/baseline.mp4 --manifest edit-evidence/baseline.json --srt edit-evidence/baseline.srt --adaptive --fps 30
          math-animation edit-start --package edit-evidence/base --movie edit-evidence/baseline.mp4 --manifest edit-evidence/baseline.json --session edit-evidence/session --fps 30
      - name: Prepare a two-requirement natural-language first round and second refinement
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path('edit-evidence')
          def make(changes):
              return {
                "schema_version":"1.0","model":"teacher-approved-test-edits",
                "requirements":[{
                    "id":f"r{i}","instruction":label,
                    "target":pointer,"operation_ids":[f"p{i}"]
                } for i,(pointer,value,label) in enumerate(changes,1)],
                "operations":[{
                    "id":f"p{i}","file":"spoken_classroom.json",
                    "pointer":pointer,"action":"set","value":value
                } for i,(pointer,value,label) in enumerate(changes,1)]
              }
          first=make([
              ("/events/0/spans/0/parts/0/value",
               "我们先看这道直角三角形题。两条直角边的长度分别为八和六，需要求斜边与周长。先把图画好。",
               "请把开场讲解改得更像真实老师。"),
              ("/events/0/spans/1/parts/0/value",
               "我们先明确直角边和斜边的位置，再利用勾股定理求出第三边，最后计算周长。",
               "第二句说得更简洁，关键思路仍要完整。"),
          ])
          second=make([
              ("/events/1/spans/0/parts/0/value",
               "直角顶点就在这里，两条直角边相互垂直。请看图中的位置，另外一条边才是斜边。",
               "上一轮还不满意，第二幕这里再解释清楚些，前面已改好的不要动。"),
          ])
          for name,obj in [('round1.json',first),('round2.json',second)]:
              (target/name).write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: First real TTS and MathTex revised MP4
        run: |
          math-animation edit-apply --session edit-evidence/session --instruction "开场讲得更像老师；第二句更简洁，但不要跳过必要步骤。" --plan edit-evidence/round1.json
          math-animation edit-feedback --session edit-evidence/session --text "开场可以了，但第二幕的直角位置还要再解释清楚。"
      - name: Second real revised MP4 based strictly on previous latest video package
        run: |
          math-animation edit-apply --session edit-evidence/session --instruction "第二幕还要再讲清楚一点，第一幕已经满意不要改变。" --plan edit-evidence/round2.json
          math-animation edit-feedback --session edit-evidence/session --text "现在满意，可以结束微调。" --satisfied
          math-animation edit-export --session edit-evidence/session --output edit-evidence/edit_training_history.json
      - name: Verify final real audio, MathTex subtitles, iteration history and only latest public output
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('edit-evidence/session')
          data=json.loads(Path('edit-evidence/edit_training_history.json').read_text())
          state=json.loads((root/'edit_session.json').read_text())
          report=json.loads((root/'latest_manifest.json').read_text())
          assert data['current_revision']==2
          assert data['current_satisfied'] is True
          assert len(data['rounds'])==2
          assert all(x['status'] in ('needs_revision','accepted') for x in data['rounds'])
          assert [len(x['requirements']) for x in data['rounds']]==[2,1]
          assert data['rounds'][0]['original_instruction'].startswith('开场讲得')
          assert data['rounds'][1]['original_instruction'].startswith('第二幕还要')
          assert report['voice_status']=='real_edge_neural_pcm_verified'
          assert report['subtitle_status']=='actual_tts_phrase_aligned'
          assert report['math_caption_renderer']=='true_manim_mathtex'
          assert report['fabricated_voice_or_subtitle_count']==0
          assert report['voiced_action_count']==18
          assert (root/'latest.mp4').stat().st_size>100000
          assert (root/'latest.srt').stat().st_size>100
          streams=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_streams','-of','json',
              str(root/'latest.mp4')
          ]))['streams']
          assert set(x['codec_type'] for x in streams)>={'audio','video'}
          src=json.loads((root/'versions/0002/package/spoken_classroom.json').read_text())
          assert src['events'][0]['spans'][0]['parts'][0]['value'].startswith('我们先看这道')
          assert src['events'][0]['spans'][1]['parts'][0]['value'].startswith('我们先明确')
          assert src['events'][1]['spans'][0]['parts'][0]['value'].startswith('直角顶点')
          print('V2_6_5_REAL_ITERATIVE_VOICE_VIDEO_PASS', data['current_revision'],
                'revisions', len(data['rounds']), 'recorded rounds', report['actual_video_frames'], 'final frames')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-6-5-latest-real-classroom-video-and-single-json-history
          path: |
            edit-evidence/session/latest.mp4
            edit-evidence/session/latest.srt
            edit-evidence/session/latest_manifest.json
            edit-evidence/edit_training_history.json
          if-no-files-found: warn
