name: V2.5.2 verified matrices and genuine classroom MP4
on:
  push:
    branches: [feature/v2-5-2-matrix-classroom]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-algebra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install reviewed modules and symbolic verifier
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Matrix step, determinant, inverse and unsafe-parameter negatives
        run: cd animation_engine && python -m pytest tests/test_matrix_classroom.py -q
      - name: Source compatibility - complete teacher module
        run: cd teacher_module && python -m pytest -q
      - name: Director compatibility
        run: cd visual_director && python -m pytest -q
      - name: All previous video animation tests
        run: cd animation_engine && python -m pytest -q -m 'not render'
      - name: Verify source syntax
        run: python -m compileall -q animation_engine/src animation_engine/tools teacher_module/src visual_director/src
  real-manim-matrix-movies:
    needs: source-and-algebra
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install actual TeX FFmpeg Manim and Chinese font system
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
      - name: Install true render and exact symbolic matrix validator
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Author three separate teacher-approved matrix lessons
        run: |
          for V in A B C; do
            mkdir -p "matrix-evidence/$V"
            python animation_engine/tools/build_matrix_classroom_lesson.py --variant "$V" --output "matrix-evidence/$V"
          done
      - name: Actual MathTex measurements and no-overlap matrix page plans
        run: |
          for V in A B C; do
            P="matrix-evidence/$V"
            math-animation plan-longboard --storyboard "$P/storyboard.json" --execution "$P/execution.json" --classroom-cues "$P/teacher_approved_cues.json" --policy "$P/page_policy.json" --matrix-steps "$P/matrix_steps.json" --output "$P/board_pages.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from animation_engine.board_motion import overlaps
          from animation_engine.persistent_chalkboard import BOARD_CENTER_X,_ink_width
          for v,count in [('A',7),('B',2),('C',1)]:
              p=Path('matrix-evidence')/v
              layout=json.loads((p/'board_pages.json').read_text())
              assert layout['matrix_operations']['operation_count']==count
              assert layout['matrix_operations']['source_verified']
              assert layout['matrix_operations']['arithmetically_verified']
              assert all(page['first_ink_y']<=layout['alignment']['max_first_ink_y']
                         and abs(page['ink_center_x']-BOARD_CENTER_X)<2
                         for page in layout['alignment']['pages'])
              active={}
              for e in layout['events']:
                  if e['erase_before']:
                      active={}
                  for b in e['added_blocks']:
                      assert b['block_id'] not in active
                      assert b['y']+b['h']<=620
                      assert all(not overlaps(b,a,margin=0) for a in active.values())
                      active[b['block_id']]=b
                  assert e['visible_block_ids']==list(active)
                  if e['matrix_stage']=='matrix_operation':
                      math=[b for b in e['added_blocks'] if b['kind']=='math']
                      assert len(math)==3
              print("VERIFIED_MATRIX_LAYOUT",v,layout['page_count'],count)
          PY
      - name: Render A B C genuine 1280x720 30fps MathTex teaching videos
        run: |
          for V in A B C; do
            P="matrix-evidence/$V"
            math-animation render-longboard --storyboard "$P/storyboard.json" --execution "$P/execution.json" --classroom-cues "$P/teacher_approved_cues.json" --policy "$P/page_policy.json" --matrix-steps "$P/matrix_steps.json" --output "$P/matrix_classroom.mp4" --manifest "$P/video_manifest.json" --fps 30
            ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,nb_read_frames,r_frame_rate -of json "$P/matrix_classroom.mp4" > "$P/ffprobe.json"
          done
      - name: Inspect real frames, stage persistence, boundaries, no fake audio
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageDraw
          root=Path("matrix-evidence")
          for variant,count in (("A",7),("B",2),("C",1)):
              p=root/variant
              m=json.loads((p/'video_manifest.json').read_text())
              q=json.loads((p/'ffprobe.json').read_text())['streams'][0]
              assert (q['width'],q['height'],q['r_frame_rate'])==(1280,720,'30/1')
              assert int(q['nb_read_frames'])>250
              assert m['matrix_operations']['operation_count']==count
              assert m['erase_count']==m['page_count']-1
              assert m['in_page_reposition_count']==m['in_page_fadeout_count']==0
              assert m['voice_status']=='not_recorded'
              ids=['e_intro','e_step1','e_final']
              if count>1: ids.insert(2,'e_step'+str(count))
              shots=[]
              for eid in ids:
                  ev=next(e for e in m['event_timing'] if e['event_id']==eid)
                  target=p/(eid+'.png')
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                      '-ss',str(max(0,ev['end_preview_second']-.2)),
                      '-i',str(p/'matrix_classroom.mp4'),
                      '-frames:v','1',str(target)],check=True)
                  image=Image.open(target).convert('RGB')
                  assert image.size==(1280,720)
                  shots.append((eid,image))
              grid=Image.new('RGB',(1280,390*((len(shots)+1)//2)),'#F0F2F5')
              draw=ImageDraw.Draw(grid)
              for i,(eid,frame) in enumerate(shots):
                  x=640*(i%2)
                  y=390*(i//2)+25
                  grid.paste(frame.resize((640,360)),(x,y))
                  draw.text((x+8,y-20),eid,fill="#111111")
              grid.save(p/'matrix_stages.png')
              print("V2_5_2_REAL_MATRIX_MOVIE_PASS",variant,q['nb_read_frames'],
                    "frames",m['page_count'],"pages")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-5-2-matrix-real-mp4-and-source-evidence
          path: matrix-evidence/
          if-no-files-found: warn
