name: TEMP V2.7 Seven-Issue Real 60FPS Classroom Acceptance
on:
  push:
    branches: [fix/v27-classroom-seven-issue-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v27-final-seven-qa
  cancel-in-progress: true
jobs:
  real-classroom-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install real rendering, speech and geometry toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Independently check new mathematical question
        run: |
          python - <<'PY'
          import sympy as s
          x=s.symbols('x',real=True)
          assert s.limit((s.log(1+x)-x+x**2/2)/x**3,x,0)==s.Rational(1,3)
          PY
      - name: Construct new source-backed lesson and inspect complete narration first
        run: |
          python animation_engine/tests/fixtures/build_independent_log_limit_final_qa.py --output final-seven-qa
          math-animation export-spoken-script --spoken final-seven-qa/spoken_classroom.json --output final-seven-qa/lesson_script.md
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('final-seven-qa/lesson_script.json').read_text('utf-8'))
          assert d['acceptance']['contract_version']=='2.7'
          assert len(d['events'])==9
          assert d['events'][0]['actions'][1]['header_math_latex'].startswith('L=')
          assert d['events'][-1]['phase']=='summary'
          assert not any('board_math_latex' in a for a in d['events'][0]['actions'])
          print('SEVEN_ISSUES_SOURCE_SCRIPT_CHECKED',len(d['events']))
          PY
      - name: True XiaoXiao PCM, 60fps MathTex classroom and captions
        run: |
          math-animation render-spoken \
            --spoken final-seven-qa/spoken_classroom.json \
            --output final-seven-qa/lesson_60fps.mp4 \
            --manifest final-seven-qa/manifest.json \
            --srt final-seven-qa/lesson.srt --fps 60
      - name: Inspect actual encoded media and source-bound retention
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('final-seven-qa')
          m=json.loads((root/'manifest.json').read_text('utf-8'))
          d=json.loads((root/'lesson_script.json').read_text('utf-8'))
          assert m['voice_status']=='real_edge_neural_pcm_verified'
          assert m['subtitle_status']=='actual_tts_phrase_aligned'
          assert m['fabricated_voice_or_subtitle_count']==0
          assert m['source_narration_action_count']==m['voiced_action_count']
          assert len(m['event_timing'])==9
          probe=json.loads(subprocess.check_output(['ffprobe','-v','quiet',
             '-show_streams','-show_format','-of','json',str(root/'lesson_60fps.mp4')]))
          streams=probe['streams']
          assert {'audio','video'} <= {x['codec_type'] for x in streams}
          v=next(x for x in streams if x['codec_type']=='video')
          assert (v['width'],v['height'])==(1280,720)
          fr=list(map(int,v['avg_frame_rate'].split('/')))
          assert fr[0]/fr[1]==60,fr
          assert (root/'lesson.srt').stat().st_size>180
          times={e['event_id']:e for e in m['event_timing']}
          assert times['e_intro']['math_write_count']==0
          assert times['e_conclusion']['math_write_count']==1
          assert len(times['e_cancel']['math_emphasis_timing'])>=2
          assert all(b['source_object_id']=='m_substitute' for b in times['e_cancel']['math_emphasis_timing'])
          assert times['e_summary']['page_index'] >= times['e_conclusion']['page_index']
          summary=times['e_summary']
          assert 'm_conclusion' in summary['visible_block_ids']
          if summary['erase_before']:
              assert 'm_conclusion' in summary.get('carry_object_ids',[])
          voice=''.join(c['actual_voice_text'] for c in m['caption_timing'])
          assert '求极限：' in voice and '最后我们简单回顾' in voice
          result={
              'fps':60,'resolution':'1280x720','duration':float(probe['format']['duration']),
              'frames':m['actual_video_frames'],'events':len(m['event_timing']),
              'voiced_action_count':m['voiced_action_count'],
              'confirmed_header_not_duplicated':True,
              'confirmed_final_answer_visible_in_recap':True,
              'math_result':'1/3','status':'real-media-accepted',
          }
          (root/'seven_issue_acceptance.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n','utf-8')
          print('REAL_SEVEN_ISSUE_MEDIA_ACCEPTED',result)
          PY
      - name: Sample frames at actual event boundaries for visual examination
        if: success()
        run: |
          mkdir -p final-seven-qa/screenshots
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('final-seven-qa')
          m=json.loads((root/'manifest.json').read_text('utf-8'))
          for row in m['event_timing']:
            if row['event_id'] not in ('e_intro','e_strategy','e_substitute','e_cancel','e_conclusion','e_summary'):
              continue
            # Preserve a frame after drawing within the actual named event.
            midpoint=(row['start_preview_second']+row['end_preview_second'])/2
            frame=root/'screenshots'/(row['event_id']+'.png')
            subprocess.run(['ffmpeg','-v','error','-y','-ss',str(midpoint),
              '-i',str(root/'lesson_60fps.mp4'),'-frames:v','1',str(frame)],
              check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v27-seven-issue-new-limit-60fps-acceptance
          path: final-seven-qa/
          if-no-files-found: warn
