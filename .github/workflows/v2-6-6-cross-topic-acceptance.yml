name: V2.6.6 cross-topic long-video stress acceptance
on:
  push:
    branches: [feature/v2-6-6-incremental-render]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v266-cross-topic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  matrix-integral-proof-real-movies:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install true Manim MathTex Chinese fonts and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Independently validate source and symbolic calculations
        run: python animation_engine/tools/v266_cross_topic_stress.py --stage build --root cross-topic-evidence
      - name: Render four genuine source-verified 1280x720 30fps classroom videos
        run: python animation_engine/tools/v266_cross_topic_stress.py --stage render --root cross-topic-evidence
      - name: Verify every rendered frame, source/geometry/pagination and mathematical completeness
        run: python animation_engine/tools/v266_cross_topic_stress.py --stage audit --root cross-topic-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v266-real-long-integral-matrix-two-proofs
          path: cross-topic-evidence/
          if-no-files-found: warn
