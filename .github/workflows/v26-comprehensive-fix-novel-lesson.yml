name: V2.6 comprehensive repair and unseen problem real-video acceptance
on:
  push:
    branches: [fix/v26-comprehensive-audit-new-problem]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Existing source + newly added repair regressions
        run: |
          cd animation_engine
          python -m pytest -q -m 'not render'
          cd ../teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
  new-problem-real-video:
    needs: source-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install true Manim MathTex Edge TTS and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Create unseen substitution-integral lesson from reviewed mathematical sources
        run: python animation_engine/tools/build_novel_substitution_integral.py --output novel-integral
      - name: Render real Xiaoxiao narration, MathTex board, SRT, and MP4
        run: |
          math-animation render-spoken --spoken novel-integral/spoken_classroom.json --output novel-integral/lesson.mp4 --manifest novel-integral/manifest.json --srt novel-integral/lesson.srt --fps 30
      - name: Verify whole-lesson coverage, real media and mathematical result
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          src=Path("novel-integral")
          manifest=json.loads((src/"manifest.json").read_text(encoding="utf-8"))
          flow=json.loads((src/"unified_flow.json").read_text(encoding="utf-8"))
          assert len(flow["stages"])==1 and flow["stages"][0]["engine"]=="standard"
          assert len(manifest["event_timing"])==6
          assert manifest["voiced_action_count"]>=6
          assert manifest["voice_status"]=="real_edge_neural_pcm_verified"
          assert manifest["subtitle_status"]=="actual_tts_phrase_aligned"
          assert manifest["fabricated_voice_or_subtitle_count"]==0
          full=json.loads((src/"integration"/"teaching_package.json").read_text(encoding="utf-8"))
          assert full["lesson"]["math_objects"][-1]["latex"]==r"I=e-1"
          probe=json.loads(subprocess.check_output(["ffprobe","-v","quiet","-show_streams","-of","json",str(src/"lesson.mp4")]))
          streams={x["codec_type"] for x in probe["streams"]}
          assert {"audio","video"}<=streams
          assert (src/"lesson.srt").stat().st_size>100
          print("NOVEL_INTEGRAL_REAL_VIDEO_ACCEPTED", manifest["actual_video_frames"], manifest["voiced_action_count"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-new-substitution-integral-real-video
          path: novel-integral/
          if-no-files-found: warn
  triangle-phrase-regression:
    needs: source-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Real narration and subtitle dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Render diagram with verified phrase-level geometry beats
        run: |
          python animation_engine/tools/build_spoken_triangle.py --output phrase-triangle
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("phrase-triangle/spoken_classroom.json")
          data=json.loads(p.read_text(encoding="utf-8"))
          data["voice"]="zh-CN-XiaoxiaoNeural"
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          math-animation render-spoken --spoken phrase-triangle/spoken_classroom.json --output phrase-triangle/lesson.mp4 --manifest phrase-triangle/manifest.json --srt phrase-triangle/lesson.srt --fps 30 --adaptive
      - name: Audit phrase-cued stroke timing and abbreviated math subtitle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("phrase-triangle")
          data=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          intro=next(x for x in data["event_timing"] if x["stage_id"]=="introduce_triangle" and x["event_id"]=="e_intro")
          stroke={x["object_id"]:x for x in intro["diagram_reveal_timing"]}
          assert stroke["AB"]["start_preview_second"]>intro["action_timing"][0]["start_preview_second"]+1
          assert stroke["BC"]["start_preview_second"]>stroke["AC"]["start_preview_second"]
          abbr=[x for x in data["caption_timing"] if x["object_id"]=="m_square_handoff" and x["kind"]=="math"]
          assert len(abbr)==1 and abbr[0]["display"]==r"8^2+6^2"
          assert data["voice_status"]=="real_edge_neural_pcm_verified"
          print("SPOKEN_TRIANGLE_PHRASE_TIMING_PASS", stroke["BC"], abbr[0]["display"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-triangle-phrase-true-audio-video
          path: phrase-triangle/
          if-no-files-found: warn
