name: V2.6.3 source-verified mathematics memory and authentic classroom videos
on:
  push:
    branches: [feature/v2-6-3-classroom-math-memory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-contract-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install teacher, director and classroom animation test dependencies
        run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Check V2.6.3 memory, non-adjacent recall and case coverage
        run: |
          cd animation_engine
          python -m pytest tests/test_classroom_math_memory.py -q
      - name: Preserve V2.6.2 and V2.6.1 video contracts
        run: |
          cd animation_engine
          python -m pytest tests/test_adaptive_classroom_flow.py tests/test_unified_classroom_flow.py -q
      - name: Preserve full V2.5 math engine and screen-layout regressions
        run: cd animation_engine && python -m pytest -q -m 'not render'
      - name: Preserve teacher and visual director standards
        run: |
          cd teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
      - name: Compile all Python sources
        run: python -m compileall -q animation_engine/src animation_engine/tools teacher_module/src visual_director/src
  real-memory-classroom:
    needs: memory-contract-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install genuine Manim MathTex FFmpeg CJK environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Build new triangle memory and three-case proof
        run: |
          python animation_engine/tools/build_math_memory_triangle.py --output memory-evidence/triangle
          python animation_engine/tools/build_math_memory_cases.py --output memory-evidence/cases
          math-animation plan-memory --memory memory-evidence/triangle/math_memory.json --output memory-evidence/triangle/plan.json --adaptive
          math-animation plan-memory --memory memory-evidence/cases/math_memory.json --output memory-evidence/cases/plan.json
      - name: Render authentic MathTex classroom movies with scoped memories
        run: |
          math-animation render-memory --memory memory-evidence/triangle/math_memory.json --output memory-evidence/triangle/triangle_continuous.mp4 --manifest memory-evidence/triangle/movie_manifest.json --fps 30 --adaptive
          math-animation render-memory --memory memory-evidence/cases/math_memory.json --output memory-evidence/cases/cases_and_summary.mp4 --manifest memory-evidence/cases/movie_manifest.json --fps 30
      - name: Audit actual frames mathematics provenance and visual continuity
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image,ImageChops,ImageStat,ImageDraw
          root=Path('memory-evidence')
          stills=[]
          def shot(movie,index,path):
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-ss',str(index/30),'-i',str(movie),
                  '-frames:v','1',str(path)],check=True)
              img=Image.open(path).convert('RGB')
              assert img.size==(1280,720)
              return img
          def diff(a,b):
              return max(ImageStat.Stat(ImageChops.difference(a,b)).mean)
          for name in ('triangle','cases'):
              path=root/name
              m=json.loads((path/'movie_manifest.json').read_text())
              p=json.loads((path/'plan.json').read_text())
              assert m['memory_contract_validated'] and p['memory_contract_validated']
              assert m['memory']['source_flow_sha256']==p['memory']['source_flow_sha256']
              assert m['memory']['source_memory_sha256']==p['memory']['source_memory_sha256']
              assert m['fabricated_voice_or_subtitle_count']==0
              assert m['fps']==30
              assert m['pixel_width']==1280 and m['pixel_height']==720
              assert len(m['event_memory_timing'])==p['event_count']
              assert len(m['event_timing'])==p['event_count']
              assert [x['global_event_id'] for x in m['event_timing']]==[
                  x['global_event_id'] for x in p['events']]
              assert all(x['verified_before_use'] for x in m['memory']['recalls'])
              assert all(x['source_latex']==x['target_latex']
                         for x in m['memory']['recalls']
                         if x['mode']=='restate')
              movie=path/('triangle_continuous.mp4' if name=='triangle' else 'cases_and_summary.mp4')
              v=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-count_frames','-show_entries',
                  'stream=width,height,r_frame_rate,nb_read_frames',
                  '-of','json',str(movie)]) )['streams'][0]
              assert (v['width'],v['height'],v['r_frame_rate'])==(1280,720,'30/1')
              assert abs(int(v['nb_read_frames'])-m['actual_video_frames'])<=1
              source=shot(movie,m['stage_render_reports'][0]['video_frames']-5,
                          path/'before_transition.png')
              end=shot(movie,m['actual_video_frames']-5,path/'final_result.png')
              assert diff(source.crop((0,0,1280,106)),
                          end.crop((0,0,1280,106)))<1.6
              if name=='triangle':
                  assert m['memory']['fact_count']==3 and m['memory']['recall_count']==4
                  assert [x['diagram_action'] for x in m['stage_render_reports']]==[
                      'create','hold','hold']
                  rect=(680,202,1160,560)
                  panel=source.crop(rect)
                  middle=shot(movie,m['stage_render_reports'][1]['start_frame']+30,
                              path/'graph_kept_after_first_wipe.png')
                  last=shot(movie,m['stage_render_reports'][2]['start_frame']+30,
                            path/'graph_kept_after_second_wipe.png')
                  assert diff(panel,middle.crop(rect))<5
                  assert diff(panel,last.crop(rect))<5
                  assert m['preserving_wipe_count']==2
              else:
                  assert m['memory']['case_merge_count']==1
                  assert m['memory']['case_merges'][0]['covered_cases']==[
                      'equal','greater','less']
              stills.extend([(name+':first',source),(name+':final',end)])
              print('V2_6_3_REAL_MATHTEX_MEMORY_PASS',name,v['nb_read_frames'],'frames')
          canvas=Image.new('RGB',(1280,810),'#f1f4f8')
          draw=ImageDraw.Draw(canvas)
          for i,(label,img) in enumerate(stills):
              x=i%2*640; y=i//2*400+25
              canvas.paste(img.resize((640,360)),(x,y))
              draw.text((x+12,y-20),label,fill='#111111')
          canvas.save(root/'memory_key_frames.png')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-6-3-reviewed-memory-triangle-proof-mp4-plans-and-keyframes
          path: memory-evidence/
          if-no-files-found: warn
