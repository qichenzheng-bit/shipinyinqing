name: V2.6 spoken drawing and no-rote-repetition real-video QA
on:
  push:
    branches: [fix/voice-diagram-timeline-and-redundancy]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spoken-diagram-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[test]'
      - name: Validate teaching order, diagram source and all previous non-render tests
        run: |
          cd animation_engine
          python -m pytest tests/test_spoken_classroom.py tests/test_classroom_math_memory.py -q
          python -m pytest -q -m 'not render'
          cd ../teacher_module && python -m pytest -q
          cd ../visual_director && python -m pytest -q
  real-synchronized-triangle:
    needs: source-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install real Manim MathTex neural speech and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test,speech]'
      - name: Build authored spoken triangle and choose previously confirmed Xiaoxiao voice
        run: |
          python animation_engine/tools/build_spoken_triangle.py --output synchronized-evidence
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("synchronized-evidence/spoken_classroom.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          x["voice"]="zh-CN-XiaoxiaoNeural"
          x["speech_rate"]="+1%"
          p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Render authentic TTS and MathTex timeline without duplicated narration
        run: |
          math-animation render-spoken --spoken synchronized-evidence/spoken_classroom.json --output synchronized-evidence/fixed_classroom.mp4 --manifest synchronized-evidence/manifest.json --srt synchronized-evidence/fixed_classroom.srt --fps 30 --adaptive
      - name: Inspect source-preserved three-sided triangle in actual decoded video
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from PIL import Image
          d=Path("synchronized-evidence")
          manifest=json.loads((d/"manifest.json").read_text("utf-8"))
          diary=json.loads((d/"diagram"/"diagram_classroom.json").read_text("utf-8"))
          assert {"AB","AC","BC"}.issubset(diary["stages"][0]["reveal_ids"])
          assert "BC" not in diary["stages"][2]["reveal_ids"]
          first=next(x for x in manifest["event_timing"] if x["stage_id"]=="introduce_triangle" and x["event_id"]=="e_intro")
          shape=next(x for x in first["action_timing"] if x["kind"]=="diagram")
          reveals={x["object_id"]:x for x in first["diagram_reveal_timing"]}
          assert {"AB","AC","BC"}.issubset(reveals),reveals
          assert reveals["BC"]["start_preview_second"]>=reveals["AC"]["end_preview_second"]-1/30
          share=(reveals["BC"]["end_preview_second"]-shape["start_preview_second"])/(shape["end_preview_second"]-shape["start_preview_second"])
          assert 0.45<share<0.94,share
          from animation_engine.diagram_classroom import DIAGRAM_PANEL
          # Segment BC has midpoint (B+C)/2 in the source-authored geometry.
          bx=DIAGRAM_PANEL["x"]+(.19+224/480)*DIAGRAM_PANEL["w"]
          by=DIAGRAM_PANEL["y"]+.82*DIAGRAM_PANEL["h"]
          cx=DIAGRAM_PANEL["x"]+.19*DIAGRAM_PANEL["w"]
          cy=DIAGRAM_PANEL["y"]+(.82-168/358)*DIAGRAM_PANEL["h"]
          mx,my=round((bx+cx)/2),round((by+cy)/2)
          def frame(n,name):
              path=d/name
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                  "-ss",str(n/30),"-i",str(d/"fixed_classroom.mp4"),
                  "-frames:v","1",str(path)],check=True)
              pic=Image.open(path).convert("RGB")
              assert pic.size==(1280,720)
              return pic
          early=frame(3,"before_diagonal.png")
          complete=frame(max(5,round(shape["end_preview_second"]*30)-3),"triangle_drawn_with_voice.png")
          def dark_count(img):
              return sum(max(img.getpixel((x,y)))<165
                  for x in range(mx-6,mx+7) for y in range(my-6,my+7))
          assert dark_count(early)<2,(mx,my,dark_count(early))
          assert dark_count(complete)>3,(mx,my,dark_count(complete))
          assert manifest["voice_status"]=="real_edge_neural_pcm_verified"
          assert manifest["subtitle_status"]=="actual_tts_phrase_aligned"
          assert manifest["voiced_action_count"]==18
          assert manifest["fabricated_voice_or_subtitle_count"]==0
          print("SPOKEN_DRAWING_DECODED_VIDEO_SYNC_PASS",
              "frames",manifest["actual_video_frames"],"diagonal_progress",share,
              "pixels_before_after",dark_count(early),dark_count(complete))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-fixed-teacher-spoken-triangle-genuine-video
          path: synchronized-evidence/
          if-no-files-found: warn
  cross-topic-render-regression:
    needs: source-and-regression
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install MathTex and video toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libcairo2-dev libpango1.0-dev ffmpeg texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm ghostscript fonts-noto-cjk
          python -m pip install -e './teacher_module[test]' -e './visual_director[test]' -e './animation_engine[render,test]'
      - name: Revalidate four math source structures and render real classroom movies
        run: |
          python animation_engine/tools/v266_cross_topic_stress.py --stage build --root cross-topic-evidence
          python animation_engine/tools/v266_cross_topic_stress.py --stage render --root cross-topic-evidence
          python animation_engine/tools/v266_cross_topic_stress.py --stage audit --root cross-topic-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v26-spoken-fix-four-math-types-regression
          path: cross-topic-evidence/
          if-no-files-found: warn
