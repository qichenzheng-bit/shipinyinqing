plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.weiguang.math'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.weiguang.math'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
        }
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
